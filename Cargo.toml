[workspace]
resolver = "3"
members = ["crates/core","crates/api","crates/platform","crates/bridge-gpui","crates/xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
notes-core = { path = "crates/core" }
notes-api = { path = "crates/api" }
notes-platform = { path = "crates/platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
tempfile = "3"
# Pinned: 0.1.x is yanked and the API moved (docs/roadmap.md watch items).
# default-features = false is REQUIRED, not tidiness: gpui supplies its own application manifest through
# windows-manifest, and linking a second one into the executable is a hard linker error
# ("duplicate resource: type MANIFEST (ID 24) / name ID 1 / language 1033"). An app that declares
# longPathAware — a notes app is handed paths of arbitrary length — must therefore own the manifest and
# turn that feature off. "font-kit" is the one default feature the bridge still needs. Measured by C4 at
# 3fe7722: with default-features on, notes-gpui.exe does not link.
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"] }
raw-window-handle = "0.6"
# Granted by FCR at S1 (bridge editor). Needed for grapheme-cluster boundaries in the caret-to-point mapping
# (slice S4) and for a caret that does not split a combining sequence. Verified present in the offline
# registry cache (1.12.0 and 1.13.3) so it resolves with --offline, which CI depends on.
unicode-segmentation = "1"
windows = { version = "0.61", features = ["Win32_Foundation","Win32_UI_WindowsAndMessaging","Win32_UI_Shell","Win32_Graphics_Gdi"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_crate_dependencies = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
