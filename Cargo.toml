[workspace]
resolver = "3"
members = ["crates/core","crates/api","crates/platform","crates/bridge-gpui","crates/bridge-slint","crates/xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
notes-core = { path = "crates/core" }
notes-api = { path = "crates/api" }
notes-platform = { path = "crates/platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
tempfile = "3"
# NO `gpui` ENTRY ANYMORE, AND THE REASON IS A LINKER FACT WORTH KEEPING IN MIND BEFORE YOU "HELP".
# gpui ships its own application manifest via the windows-manifest feature, and embedding a second one is a
# hard linker error ("duplicate resource: type MANIFEST (ID 24) / name ID 1 / language 1033"). For the 0.2.2
# generation we escaped that by depending on gpui with default-features = false, which turned the feature off
# and let OUR app.manifest own the exe. That control no longer exists: gpui-pre-platform force-enables
# windows-manifest in its OWN dependency declaration, features are additive, and every shape that can open a
# window pulls it in - verified by linking three variants that all died the same way (see
# crates/bridge-gpui/build.rs). So the toolkit manifest is the one the linker sees, and ours goes in AFTER
# the link: cargo xtask manifest replaces the embedded resource with app.manifest, then reads it back to
# prove our markers are present. Run it; a manifest nobody verifies is how you ship someone elses DPI
# awareness. longPathAware is the one declaration we would actually miss (a notes app is handed paths of
# arbitrary length), which is why we keep ours rather than accepting theirs.
# Applications depend on the kit facade alone (.agents/skills/gpui-kit): 0.6.1 pulls gpui-pre 0.3.4, renames
# it `gpui`, and flat-re-exports it (`pub use ::gpui::*`, gpui-kit-0.6.1/src/lib.rs:94), so no
# name the bridge imported disappeared.
gpui-kit = "=0.6.1"
raw-window-handle = "0.6"
# S9: the file picker. ONE declaration, per the features lesson - a member that repeats the
# version drifts the moment the root bumps it, and two copies of rfd in one lockfile is how a
# bridge ends up with two dialogs.
#
# default-features = false is the part worth the comment, and it is the lesson applied rather
# than re-learned: rfd's DEFAULTS are xdg-portal + wayland + async-std, i.e. a Linux story
# (ashpd, pollster, urlencoding) that a Windows-first spike does not need and that widens the
# offline resolve for nothing. On Windows the native IFileDialog backend is cfg-gated, not
# feature-gated, so it builds with NO features at all. Revisit when M8 lands Linux: the
# portal path is then a feature to ADD here, in one line, by name and with a reason - not a
# silent default inherited from a crate whose author was thinking about a different OS.
# common-controls-v6 is the legacy fallback picker behind a feature; the modern backend is
# what this app gets, so the feature stays off and the closure stays small.
rfd = { version = "0.16", default-features = false }
# Granted by FCR at S1 (bridge editor). Needed for grapheme-cluster boundaries in the caret-to-point mapping
# (slice S4) and for a caret that does not split a combining sequence. Verified present in the offline
# registry cache (1.12.0 and 1.13.3) so it resolves with --offline, which CI depends on.
unicode-segmentation = "1"
# THE SECOND BRIDGE'S TOOLKIT - and note what this entry is NOT: it does not replace
# gpui-kit, notes-bridge-gpui still owns the shipped app, and slice 0 of this spike
# compiles a bridge with no UI at all. 1.17.1 is what "1.17" resolves to today (the lock
# records the pair; the range is what is declared).
#
# Why it is safe to add while the other entry above is a linker minefield: Slint embeds
# no application manifest of its own, so the duplicate-resource failure that forced the
# gpui manifest migration does not exist here. If that turns out to be wrong on a real
# window, the fix is the same post-link step, not a second manifest.
#
# And why the gate can already see it: "slint" is a ROOT in arch.rs's UI_TOOLKITS list,
# so "a second toolkit may not reach core, the port or platform" is enforced from the
# first commit of the spike rather than added after the first leak.
# FEATURES ARE DECLARED HERE, ONCE, because a member CANNOT override them: cargo
# refuses the manifest with "`default-features = false` cannot override workspace's
# `default-features`" - which is exactly how this line earned its shape. Measured on
# 1.17.1, so the list is not taste:
#   - compat-1-2 is MANDATORY, not decoration. default-features=false with only
#     backend-winit + renderer-software + raw-window-handle-06 does NOT build:
#     slint-1.17.1/lib.rs:210 compile_error!s unless compat-1-2 is enabled.
#   - default-features=false is the point. It drops femtovg / glutin / OpenGL,
#     accessibility and system-tray, so the spike window is software-rendered and its
#     normal tree is i-slint-backend-winit + i-slint-renderer-software and nothing
#     else (proven out-of-tree). backend-winit implies std.
#   - raw-window-handle-06 is what makes `window_handle()` exist, the accessor that
#     proves an HWND is reachable, and it holds the same 0.6 handle family that the
#     port hands notes-platform.
# A later member may ADD features; it cannot subtract these without editing this line.
slint = {
    version = "1.17",
    default-features = false,
    features = [
        "compat-1-2",
        "backend-winit",
        "renderer-software",
        "raw-window-handle-06",
    ],
}
# Win32_Graphics_Dwm: the corner preference (DwmSetWindowAttribute/DwmGetWindowAttribute,
# attribute 33) that notes-platform/windows/corners.rs asks the OS for. It is in the ROOT list
# because a member cannot widen this dependency for itself - see the hand-declared GetACP
# block above `pub fn ansi_codepage` in crates/platform/src/windows/mod.rs, for the
# alternative and why it was not taken twice:
# GetACP is one argument-free symbol, this is two pointer-passing calls with a typed enum.
windows = { version = "0.61", features = ["Win32_Foundation","Win32_UI_WindowsAndMessaging","Win32_UI_Shell","Win32_Graphics_Gdi","Win32_Graphics_Dwm","Win32_System_Ole","Win32_System_Com","Win32_System_SystemServices","Win32_System_DataExchange"] }
# Paired to windows 0.61.3's own windows-core (lock-verified): the implement!
# macro expands to ::windows_core:: paths, so platform must name the crate.
windows-core = "0.61.2"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_crate_dependencies = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
