# CI gate for notes-gpui.
#
# Purpose: make AGENTS.md's "each invariant is enforced by CI" a true statement. Every
# command below is the manager's hand-run gate, encoded as measured — nothing here is a
# redesign of it. Local aliases exist (.cargo/config.toml: `cargo gate`, `cargo arch`,
# `cargo xtask`) and the literal commands are spelled out instead, so a failing step log
# reads as the same string you would type by hand.
#
# Deliberate omissions — each absent thing is a decision, not a gap:
#   * release packaging, MSIX/MSI  -> MSIX is ruled out on technical grounds (whitepaper SS7);
#                                     win-portable / win-install builds are M5 work.
#   * code signing                 -> no certificate exists; nothing to sign before M5.
#   * artifact upload              -> this file's whole job is a verdict, not a build product.
#   * codecov / coverage           -> a coverage number would become a target, not a signal.
#   * nightly or MSRV matrix       -> one toolchain: rust-toolchain.toml (channel = stable).
#                                     No setup-toolchain pin here on purpose — a patch pin would
#                                     fight rust-toolchain.toml and force a rustup download.
#   * ubuntu build of platform/bridge -> see core-portable below; excluded on purpose.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Verification, not deployment: the gate needs a read-only checkout token.
permissions:
  contents: read

# ~441 crates in the dependency graph: never finish a build for a superseded commit.
# cancel-in-progress is per-ref, so a new push or a new push to the same PR supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ===========================================================================
  # THE GATE. Windows-first app and crates/platform is cfg(windows), so the job
  # that decides "is M1 still standing?" must run on windows-latest.
  # ===========================================================================
  gate:
    name: gate / windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # v2 derives its key from Cargo.lock + toolchain + OS/arch itself. No bespoke key invented.
      - uses: Swatinem/rust-cache@v2

      # --- 0. lockfile authority: what --locked means, and why it is not a flag on
      # the steps below yet. Cargo.lock moved underneath us tonight (the kit migration
      # added hundreds of packages), so the claim the runner resolved the graph that was
      # reviewed now needs proving. --locked proves it: cargo ERRORS at resolution time,
      # before compiling anything, when Cargo.lock does not match the manifests, instead
      # of quietly rewriting the file mid-pipeline (step 2 builds one graph, step 7
      # tests another, check-deps reports on neither).
      #
      # Measured on a scratch copy of HEAD (git archive extract, private target dir,
      # cargo 1.98.0) with
      # one dependency line planted in crates/core/Cargo.toml and the lock left alone:
      #   cargo metadata            -> exit 0 AND Cargo.lock modified: tonight behaves
      #                               this way, a silent mid-run graph swap
      #   cargo metadata --locked   -> exit 101, and this is the text a reader will see:
      #     error: cannot update the lock file <path>/Cargo.lock because --locked was
      #       passed to prevent this
      #     help: to generate the lock file without accessing the network, remove the
      #       --locked flag and use --offline instead.
      #   CARGO_LOCKED=1            -> exit 0, lock rewritten: there is no env substitute
      #   --config resolve.locked=1 -> exit 0, lock rewritten: no such config key exists
      #
      # Why the twelve gate cargo steps are still unflagged (2, 3, 3b, 3c, 3d, 3e, 4,
      # 4a, 4b, 4c, 4d, 4e): check-ci matches a step to its roster row by TOKEN
      # SIGNATURE, and signature() drops only --quiet, the bare --, pwsh -NoProfile /
      # -File / -NonInteractive, and --config plus its value. --locked is KEPT, so
      # flagging those twelve leaves eleven roster rows unknown (clippy, test,
      # bridge-build, bridge-clippy, manifest, smoke, check-arch, check-deps, fixtures,
      # check-ci, check-unsafe) plus the drift step 4c, which the checker knows through
      # the AGGREGATE constant in check_ci.rs rather than a row. Measured tonight on a
      # flagged scratch copy of this file: check-ci exits 1 with 11x [step-missing] plus
      # 12x [step-extra] - and check-ci is itself a gate, so the tree would be left red.
      # Both halves must move in one commit and the other half lives in crates/xtask
      # (the rows in check.rs AND the AGGREGATE constant in check_ci.rs), outside this
      # fence. The rows the follow-up needs, token-for-token as signature() sees them
      # (--locked directly after the subcommand, in each row's args array too - the
      # comparison is over args, the display string is cosmetic):
      #   cargo clippy --locked --workspace --exclude notes-bridge-gpui --all-targets -- -D warnings
      #   cargo test --locked --workspace --exclude notes-bridge-gpui
      #   cargo --config 'future-incompat-report.frequency="never"' --locked build -p notes-bridge-gpui --bin notes-gpui
      #   cargo --config 'future-incompat-report.frequency="never"' --locked clippy -p notes-bridge-gpui --all-targets -- -D warnings
      #   cargo run --locked -p xtask -- manifest
      #   cargo run --locked -p xtask -- smoke
      #   cargo run --locked -p xtask -- check-arch
      #   cargo run --locked -p xtask -- check-deps
      #   cargo run --locked -p xtask -- fixtures verify
      #   cargo run --locked -p xtask -- check      (plus AGGREGATE: "cargo run --locked -p xtask check")
      #   cargo run --locked -p xtask -- check-ci
      #   cargo run --locked -p xtask -- check-unsafe
      # So --locked is live today on the two jobs check-ci does not parse
      # (bridge-gpui-advisory and core-portable; the latter also proves the lock
      # resolves on Linux), and the gate steps get their flags in the follow-up carrying
      # the matching rows. Partial and green beats complete and red, and this paragraph
      # is the receipt for what is still missing.
      #
      # If a step ever fails with the error above, its meaning is exact: a manifest
      # changed in that commit and the lock did not come with it. The fix is not to
      # re-run it. Run cargo check (or cargo update -p <crate>) locally and commit the
      # resulting Cargo.lock IN THE SAME COMMIT as the manifest: the lock is folded, not
      # incidental, which is the convention the cargo help text does not state.
      #
      # Deliberately not added anywhere: --offline (the local cache resolves this whole
      # graph offline today, which says nothing about a fresh runner cache after a
      # migration that pulled the kit over the network, and an uncached-crate refusal has
      # nothing to do with the change under review). And not on fmt: cargo fmt resolves
      # no graph - measured: with the stale lock planted, fmt --all -- --check ran to its
      # own formatting verdict and left the lock byte-identical.
      #
      # --- 1. formatting (rustfmt defaults, AGENTS.md "Code conventions") ----
      # "--all" means every workspace member, notes-bridge-gpui included: the bridge is
      # ALREADY format-gated here, so it needs no duplicate fmt step further down.
      - name: fmt — cargo fmt --all -- --check
        run: cargo fmt --all -- --check

      # --- 2. lints -----------------------------------------------------------
      # notes-bridge-gpui is excluded from THIS invocation only, and the word is the
      # whole point: exactly ONE member is named, so notes-bridge-slint IS in this run and
      # in step 3 below. The reason for the one exclusion is gpui's pin to =0.2.2 - one
      # upstream deprecation would fail the workspace run for every crate at once, and the
      # exclusion keeps the verdict attributable.
      #
      # WHAT THIS COMMENT USED TO IMPLY, and why it is spelled out now: it said "the
      # bridge is linted by its own named step below", singular, at a time when there was
      # one bridge. Read that way this line was the reason nobody noticed that the
      # SHIPPING product had never been BUILT in CI - slint passed here (it is not
      # excluded) and passed the test step, which looks like total coverage, and neither
      # step ever links a bin. Coverage of a bridge is now named per bridge:
      #   notes-bridge-gpui   clippy/test: excluded here -> 3c lints it, 3b links it.
      #   notes-bridge-slint  clippy/test: IN this run and in step 3 -> 3f links it,
      #                       3g lints every target. Its tests gate, because nothing
      #                       excludes them; gpui's do not, and stay advisory (below).
      # DELIBERATELY UNBOUNDED (and this is step 2, the first cargo step of the job, so it
      # pays for the cold dependency compile out of Swatinem/rust-cache). Warm, the subset
      # measured below costs 1.7 s; cold, nothing here was measurable this session without
      # a real CI run to time it against, and a step timeout guessed below the cold graph
      # compile would convert a slow-but-green run into a false red. The 45-minute job
      # timeout is the backstop. Revisit with one measured CI duration - and if you do
      # bound it, bound the bridge clippy at 3c too so the two cannot disagree.
      - name: clippy — cargo clippy --locked --workspace --exclude notes-bridge-gpui --all-targets -- -D warnings
        run: cargo clippy --locked --workspace --exclude notes-bridge-gpui --all-targets -- -D warnings

      # --- 3. tests (== the `cargo gate` alias) ------------------------------
      # BOUNDED, and bounded from measured numbers rather than a guess, because a hang in
      # here used to cost the job its whole 45-minute timeout with nothing in the log to
      # say which test stopped: the port has a REPRODUCED deadlock (engine thread inside
      # SetWindowPos against a parked UI thread, close() joining unbounded - blocked
      # 12,002 ms in isolation, >15 s with no panic and no event in the full-stack probe).
      # AGENTS.md already says the two deadlocks show up "only under load", which is
      # precisely the bug that passes a laptop and hangs a runner, so the bound is the
      # point: a 15-minute red with this step name beats a 45-minute silence.
      #
      # Measured on this machine (warm target dir, --offline, this session):
      #   cargo test -p notes-core      3.0 s  (142 passed, 2.05 s of test time)
      #   cargo test -p notes-platform  0.5 s  (28 passed, 0.01 s)
      #   cargo test -p xtask           2.1 s  (78 passed, 1.60 s)
      #   cargo clippy -p core -p platform -p xtask --all-targets -D warnings  1.7 s
      # A full green three-run sample of the step itself was NOT obtainable: the tree is
      # red mid-flight in notes-api (test target reentrancy) and in notes-core
      # (path_hazards), both other lanes' edits, so the workspace run fails fast in ~1 s
      # instead of measuring. Cold compile is bounded from the nearest measured cold
      # number in this session - the private-target bridge build, 2m11s for the whole
      # dependency graph - so 15 min is ~7x that and ~300x the warm worst case (3 s):
      # slack enough that no legitimately slow runner gets cut off, short enough to name
      # a hang. Raise it only with a measured CI duration, never to silence a red.
      - name: test — cargo test --locked --workspace --exclude notes-bridge-gpui
        timeout-minutes: 15
        run: cargo test --locked --workspace --exclude notes-bridge-gpui

      # --- 3b/3c. THE BRIDGE: which checks gate, and which deliberately do not -
      # One place, so nobody re-decides this per-file. notes-bridge-gpui is no longer a
      # stub: it carries build.rs + app.manifest and produces notes-gpui.exe, the shipped
      # artifact. An allow-fail advisory on that is a route for a link break to reach
      # master, so the split is:
      #   FMT     GATES  - and always did: step 1 is "cargo fmt --all", which covers every
      #                    workspace member including this one. Deliberately no second fmt
      #                    step here; a duplicate would only invite them to disagree.
      #   BUILD   GATES  - step 3b below. "cargo check" never links, so the real failure we
      #                    already hit (gpui's "windows-manifest" default feature embedding
      #                    a second RT_MANIFEST id=1 beside ours -> rust-lld refuses) is
      #                    invisible to a check-only gate, as is a version-pin divergence
      #                    on gpui =0.2.2 or an API break that bites only at link time.
      #   CLIPPY  GATES  - step 3c below, its OWN named step, --all-targets -D warnings.
      #   TEST    DOES NOT GATE - it stays advisory, in bridge-gpui-advisory. There are no
      #                    GUI tests to run yet, and a headless runner may not be able to
      #                    create a window at all: a red there means either "the app broke"
      #                    or "this machine has no desktop session", and a gate that cannot
      #                    tell those apart is noise that gets ignored. Advisory keeps the
      #                    signal without the false alarm.
      #
      # Where this was measured, because a promotion nobody ran is a lie: a CLEAN worktree
      # of HEAD 14295b8 ("git worktree add --detach", its own target dir) - never the
      # shared working tree, which is somebody else's half-landed edit - on Windows, with
      # the commands exactly as they appear below:
      #   cargo build  -p notes-bridge-gpui --bin notes-gpui              -> exit 0, 2m11s, notes-gpui.exe linked
      #   cargo clippy -p notes-bridge-gpui --all-targets -- -D warnings   -> exit 0, 1m26s
      #   cargo fmt --all -- --check                                       -> exit 0 (step 1 already covers the bridge)
      #   cargo run -p xtask -- check-deps                                 -> exit 0, "5 member crates, 0 violations" (step 4a)
      # Re-measure committed state before believing any of it, and mind that HEAD is a
      # moving target: one commit earlier (b238f1e) notes-api did NOT compile in a pristine
      # worktree - E0308 in gateway.rs against the then-uncommitted Engine::new arity and
      # Settings::load change - so 3b and 3c were red there and promoting them then would
      # have gated master on a lie. api landed at 14295b8 and both went green. Which is the
      # standing instruction for the next reader:
      #   * 3b/3c red with the error in ANOTHER crate: that crate's owner fixes it. Do not
      #     re-demote these steps to continue-on-error to unblock a run; the link is fine.
      #   * 3b/3c red with the error in the bridge, or rust-lld plus a duplicate resource:
      #     the bridge is broken, and these two steps are the gate that exists to say so.
      #
      # future-incompat-report.frequency=never, on these two bridge steps and nowhere else:
      # gpui's graph pulls proc-macro-error2 v2.0.1, whose future-incompat footer cargo
      # reprints on every invocation that actually compiles something (it is in both
      # measured runs above), and nothing in this repo can clear it. The scope is narrow by
      # design - this is NOT a warning suppression:
      #   * it hides that FOOTER ONLY. -D warnings still turns every rustc/clippy
      #     diagnostic in the same invocation into an error, and no step here pipes output
      #     through a filter, a "|| true", or a grep that could eat a real message; the
      #     greps below only ADD annotations, they never change the exit status.
      #   * it is a per-command --config flag, not a [future-incompat-report] entry in
      #     .cargo/config.toml, so it cannot leak into a developer run or another step.
      #   * the condition cannot rot unseen: bridge-gpui-advisory compiles the same graph
      #     at cargo's DEFAULT frequency, so the footer still prints once per run in a job
      #     that gates nothing, and "cargo report future-incompatibilities --id 1" shows it
      #     on demand. If a SECOND package ever joins that footer, that is new information
      #     and this suppression should be revisited, not inherited silently.
      #
      # Is 3b redundant now that smoke builds its own target (5e905c5: exit 4 when the
      # target will not compile, exit 5 when the exe on disk is older than its sources)?
      # No - keep it, and the argument is which verdict each step OWNS. 3b is the LINK gate:
      # it is the only cell whose entire job is to go red on rust-lld refusing a duplicate
      # RT_MANIFEST, and it does that with a name attached. Smoke compiles as a
      # PRECONDITION for a runtime verdict, so its 4 says "I could not run", not "the link
      # is broken", and its 5 refuses to judge a stale binary at all. Delete 3b and a link
      # break moves from a named red cell into an annotation on an advisory step - which is
      # the exact downgrade this file was written to prevent. (Both also dodge the stale-
      # exe trap by going through cargo run; no step in this file invokes an exe path.)
      # --- 3b. the bridge LINKS ------------------------------------------------
      - name: bridge — cargo build --locked -p notes-bridge-gpui --bin notes-gpui (the exe must link)
        id: bridge
        shell: bash
        run: |
          # Actions runs "shell: bash" on Windows as "bash -e" WITHOUT pipefail: without
          # this line, a cargo failure behind "| tee" reads as tee's success and a red
          # check prints green. Every piped bash step below carries it for that reason.
          set -o pipefail
          status=0
          cargo --config 'future-incompat-report.frequency="never"' build --locked -p notes-bridge-gpui --bin notes-gpui 2>&1 | tee "$RUNNER_TEMP/bridge-build.log" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # Annotate the first errors so the cause is visible without scrolling a long log.
          while IFS= read -r line; do
            echo "::error::$line"
          done < <(grep -E '^error' "$RUNNER_TEMP/bridge-build.log" | head -12 || true)
          if [ "$status" = "0" ]; then
            echo "bridge build: notes-gpui.exe linked."
          else
            echo "::error::BRIDGE BUILD FAILED (exit $status) - notes-gpui.exe did not link, or a dependency did not compile. If the log shows rust-lld and a duplicate resource, that is the RT_MANIFEST id=1 clash: set default-features = false for gpui in the ROOT Cargo.toml (the bridge inherits it on purpose - see crates/bridge-gpui/Cargo.toml), do not weaken this step."
          fi
          exit $status

      # --- 3c. the bridge is linted too ----------------------------------------
      # Separate step, separate name, so "clippy broke" and "the link broke" are two
      # different red cells - one merged step would hide which check broke. UNBOUNDED ON
      # PURPOSE like step 2 (measured here this session: 1m26s cold in a private target dir,
      # 10.44s warm; the job timeout is the backstop) - the reason and the numbers are
      # written down so this is a decision, not an oversight. See step 2 for the rule.
      - name: clippy (bridge) — cargo clippy --locked -p notes-bridge-gpui --all-targets -- -D warnings
        id: bridge_clippy
        shell: bash
        run: |
          set -o pipefail
          status=0
          cargo --config 'future-incompat-report.frequency="never"' clippy --locked -p notes-bridge-gpui --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/bridge-clippy.log" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # rustc/clippy diagnostics start at column 0; the leading anchor keeps source
          # snippets quoted inside a diagnostic from being annotated as if they were one.
          while IFS= read -r line; do
            echo "::error::$line"
          done < <(grep -E '^(error|warning)(\[[0-9A-Za-z-]+\])?:' "$RUNNER_TEMP/bridge-clippy.log" | head -12 || true)
          if [ "$status" = "0" ]; then
            echo "clippy (bridge): clean at -D warnings."
          else
            echo "::error::CLIPPY FAILED ON THE BRIDGE (exit $status) - a lint, or a real compile error, under -D warnings. The crate names in the annotations above say which."
          fi
          exit $status

      # --- 3d. the manifest inside the exe is OURS, and it is a gate ----------
      # "cargo run -p xtask -- manifest" (crates/xtask/src/manifest.rs) replaces the
      # embedded assembly identity / longPathAware / dpiAware declaration in the BUILT
      # exe and then READS THE FILE BACK to prove the replacement landed - mt.exe saying
      # ok is not the verdict, the produced resource is.
      # Bare invocation, deliberately: the roster row is "cargo run -p xtask manifest" and
      # check-ci matches a step by TOKEN SIGNATURE, so spelling out the default path
      # (target/debug/notes-gpui.exe, which the tool already assumes) would make this step
      # unknown to the very contract check that demands it exist.
      # GATE, not advisory, and not --quick-skippable: a wrong DPI declaration is not a
      # desktop dependency, it is a shipped binary contradicting D40/D42, and the state
      # this step exists to detect is exactly the one a skip would hide.
      # POSITION: after 3b (it mutates the exe 3b just linked) and before smoke (3e), so
      # the runtime probe launches the artifact as shipped, not the pre-mutation one.
      #
      # Exit codes, exactly as the lane published them:
      #   0  verified - replaced AND read back out of the file
      #   20 NO SDK - mt.exe not found, and the tool says nothing was written
      #   21 REFUSED TO JUDGE - mt.exe claimed success and the read-back disagrees
      #   22 CANNOT RUN - no exe at the path, source manifest unreadable, mt.exe nonzero
      #
      # 20 GATES RED HERE ON PURPOSE, a deliberate disagreement with how smoke handles its
      # own decline: windows-latest ships the Windows SDK, so a NO-SDK verdict on a runner
      # means OUR discovery broke (the newest-first search under Program Files found no
      # bin/*/x64/mt.exe), not that the machine is unkind. A decline that reads as a pass
      # is how a check becomes permanently inert with nobody noticing, and the tool already
      # separates "not installed" from "not found" - so the workflow must not blur them.
      # On a developer laptop 20 is honest; run from a Developer Prompt or read the search
      # path it prints. Never re-purpose this arm to make a red row go away.
      #
      # mt.exe prints a Microsoft banner on stdout, and this step captures it (tee, no
      # filtering): if 21 ever fires, the banner and mt.exe's own claim are the evidence,
      # and a grep -v that removes the banner could just as easily remove a real line.
      - name: manifest — cargo run --locked -p xtask -- manifest (the shipped exe declares identity and DPI as ours)
        id: manifest
        shell: bash
        timeout-minutes: 5
        run: |
          set -o pipefail
          status=0
          cargo run --locked -p xtask -- manifest 2>&1 | tee "$RUNNER_TEMP/manifest.log" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          case "$status" in
            0) echo "manifest: verified - replaced and read back from the file. The PASS line above names the exe, which mt.exe was used, the size before and after, and whether the resource was already ours." ;;
            20) echo "::error::MANIFEST CHECK NEVER RAN - NO mt.exe FOUND (exit 20). windows-latest ships the Windows SDK, so this is OUR discovery breaking, not a missing prerequisite: nothing was written and the produced exe is still the toolkits declaration. Red by design (a decline that passes is an inert check); fix the mt.exe search or the SDK on the runner, and do not soften this arm to green." ;;
            21) echo "::error::MANIFEST REFUSED TO JUDGE (exit 21) - mt.exe reported success and the read-back disagrees: the declaration we asked for is NOT in the produced resource. This is the decorative-instrument failure the step exists to catch: the exe would ship with the wrong identity/DPI while a check-only CI stayed green. The file on disk is the authority, not mt.exe's exit code; the log above carries both claims side by side." ;;
            22) echo "::error::MANIFEST CHECK CANNOT RUN (exit 22) - no exe at the path step 3b should have linked, the source manifest is unreadable, or mt.exe exited nonzero. No verdict exists about the shipped binary. If 3b is green and this still says no exe, that is a step-order or path problem and not a product bug." ;;
            *) echo "::error::MANIFEST COULD NOT JUDGE (exit $status) - the tool returned something outside its published contract, so nothing about the shipped manifest is known. This arm deliberately names NO numbers, because an arm that enumerates codes goes stale the day one is added; read it as no information, never as a pass." ;;
          esac
          exit $status
      # --- 3e. the smoke leg, which is the PRODUCT by default, and stays advisory -
      # "cargo run -p xtask -- smoke" (crates/xtask/src/smoke.rs) with NO --binary flag
      # judges smoke::DEFAULT_BINARY = "slint": it launches the real notes-slint.exe - the
      # shipped product, not the frozen bridge - waits a bounded time for a window handle
      # and a title, closes it with a REAL WM_CLOSE, asserts the process exited BY ITSELF
      # with the observed code, then asserts that run wrote session.json. A forced kill
      # can never print PASS even when the exit code reads 0 (pinned by a test), so this is
      # the one row that says "the app shut down honestly and persisted" - no compile step
      # can say that, and no headless unit test does either.
      #
      # BARE IS A CONTRACT HERE, NOT SHORTHAND. This is the step check-ci recognises as the
      # smoke row - check_ci::Step::is_smoke() reads the LAST TOKEN of the command, and
      # "smoke" is that token only while no flag follows it - so the arms below are the ones
      # machine-checked against smoke::CONTRACT. Spelling the default out as --binary=slint
      # would un-recognise the step, and decide_contract would print [contract-unreadable]
      # and exit 2: check-ci refuses rather than report a green it did not earn. The product
      # travels by DEFAULT on this line; the flag lives in 3h, where it pins the other leg.
      # WHICH OF 6/7/9 CAN ACTUALLY FIRE HERE is a different sentence than it was before
      # S8, and it is spelled out because the old one went false under that commit:
      #   6 CAN - product_maximised_cycle is a producer on THIS leg, so a bare run over
      #     Slint bytes returns GEOMETRY_FAILED_EXIT by itself when a real maximise, a
      #     close, a relaunch and the restore rect disagree. No flag, no needle schedule,
      #     no gpui anywhere near the call - this arm has been waiting for it since the
      #     product became the default.
      #   7 CANNOT yet - its only producer is the two-polarity pin read inside the gpui
      #     needle schedule's geometry_round_trip, which this leg does not run.
      #   9 CANNOT yet - its only producer is judge_trace over the recents announce, in
      #     that same schedule.
      # 7 and 9 stay armed anyway: a published contract code keeps its arm whatever the
      # current artifact can return, and check-ci's [arm-missing] rule goes red if an arm
      # is dropped. The schedule itself now runs, named out loud, in 3h.
      #
      # ADVISORY (continue-on-error) on purpose, twice over: a runner with no interactive
      # desktop is not a broken repo (exit 3 = DECLINED), and a GUI row that goes red for
      # environmental reasons trains everyone to ignore the row. It is also a row in xtask's
      # own step table (advisory and --quick-skippable), so the drift lock at 4c reports it
      # too; this step exists to give it its own cell and its own annotation.
      #
      # Two mechanical rules carry the rest of this step. As of 5e905c5 smoke BUILDS ITS
      # OWN target before it launches anything - so it no longer depends on 3b having run
      # (3b still owns the link verdict, and stays first so a link break is named there).
      # And the step ends exit $status even though it is advisory: a step whose last
      # command is an echo always returns 0, so a real shutdown failure would render as a
      # green cell - continue-on-error keeps that red from turning the run red.
      #
      # The exit-code contract, printed by the run itself as "smoke: contract <codes>" and
      # checked against this step by check-ci: codes 0 through 7 and 9 (8 exists but is
      # reachable only behind --require-ours, which CI does not pass, so smoke deliberately
      # keeps it out of the table rather than asking for an arm here that can never fire).
      # Several of them mean
      # more than one thing, so the arms below keep the readings apart - "your code does not build" and
      # "this runner has no desktop" are not the same story, and an infrastructure
      # emergency must never be cited as a product bug:
      #   0  passed, AND the user state it moved aside came back byte-identical
      #   1  app or persistence failure, OR the harness damaged a user profile,
      #      OR the exe vanished mid-run (window=MISSING close=NOBIN)
      #   2  it could not JUDGE at all: no PowerShell, probe unwritable, bad usage, or
      #      unreadable source mtimes (a broken instrument, not a stale artefact)
      #   3  declined: no interactive desktop, OR foreign state on the session path
      #   4  THE TARGET DID NOT COMPILE - nothing launched, no cached exe substituted; it surfaces
      #      the first real cargo error line (smoke: build | error[...])
      #   5  STALE BINARY - the exe on disk is older than the sources that build it, and
      #      the --no-build diagnostic path refuses to judge against it
      #   6  THE WINDOW-MEMORY PROMISE BROKE - the app ran, closed cleanly and persisted
      #      something, but the seeded rect did not come back, or a harness-driven move
      #      never reached session.json (f7b295c; GEOMETRY_FAILED_EXIT). Geometry that
      #      cannot be measured prints NOT JUDGED (advisory) and leaves the code alone - an
      #      unverifiable step is reported as neither a pass nor a failure
      #   7  THE PIN LIED - WS_EX_TOPMOST on the live window did not follow session.json,
      #      read in BOTH polarities (seed pinned:true must show 1; flipped to false it must
      #      show 0) across two launches (9b84bb7b; PIN_FAILED_EXIT). Separate from 6
      #      because the usual cause is ordering, not persistence - and already seen red.
      #   9  THE STARTUP ANNOUNCE NEVER REACHED THE LIVE UI - the app ran, closed and
      #      persisted, and the stderr redirected from it named no RecentsUpdated while the
      #      profile held recents to announce (smoke::TRACE_FAILED_EXIT; roadmap M2 item 5).
      #      NOT JUDGED is printed and the code left alone when the capture was unreadable or
      #      the profile had nothing to announce
      #
      # Codes 4, 5 and 6/7 say two opposite things, and the arms must not blur them. 4 and
      # 5 are the INSTRUMENT refusing to lie about which binary it tested: nothing was
      # launched, no cached exe was quietly substituted, so a red 5 in particular must
      # never be read as "the app is broken" - it means the exe on disk is not the exe this
      # commit builds, and the runtime was never probed at all. 6 and 7 are the opposite,
      # and much worse news: everything ran, and the two headline promises - come back
      # where the state file said, stay above what you were told to - did not hold.
      #
      # The arms are documentation of a contract the HARNESS owns, and the step body never
      # branches on a hand-maintained list (see the catch-all wording). The gap is real:
      # codes 4/5, then 6, then 7 each landed with no arm waiting, because check-ci
      # compares the ROSTER of commands and says nothing about exit codes. The fix is
      # queued with the xtask lane, not invented in this file: smoke.rs publishes a
      # CONTRACT table derived from its own constants, and check-ci asserts [arm-missing] /
      # [arm-extra] against this very step - so an undocumented or unhandled verdict is now
      # a red run, not a hopeful review comment. Proof it is not decorative: the rule
      # caught this file missing an arm for exit 2 (a code the catch-all covered in
      # practice) and refused anyway, because a verdict absorbed by "*" is precisely the
      # drift the check exists to catch. Standing rule that leaves: changing the contract
      # means arming it, in the same commit.
      # Every arm is attributable because the step prints its own identity line: "smoke:
      # tested binary <path> | <age> | built_by_this_run=YES|NO | git HEAD at that moment
      # <sha>" - so a green cell names the exact artifact and commit it proved.
      #
      # And one reason its colour is not its value: smoke is the ONLY step in this file that
      # has ever caught a wrote-nothing persistence failure on a real machine - it found the
      # missing state directory, and it found a foreign occupant squatting on the session
      # path. Every other step proves the code compiles, links, lints and survives unit
      # tests; only this proves the running app does the one thing the product is for.
      # Advisory (continue-on-error, and it stays that way) is a judgement about DESKTOPS:
      # this step needs an interactive window station, a real window and a live work area,
      # so a headless runner would fail it for reasons that are not the app's fault - the
      # same discipline that parks the docs validator (step 5). The point of arming every
      # code is that an advisory STEP printing an ARMED VERDICT is still a readable signal:
      # the cell stays non-fatal, the annotation says exactly what broke, and nobody has to
      # open a 400-line log to learn that the window memory is gone.
      #
      # What this step must not hide by filtering: it prints the stderr of the app it
      # launches, so a developer machine can show "SettingsCorrupt / running on defaults"
      # from a stale %APPDATA%\notes-gpui\settings.toml left behind by an earlier
      # experiment. Leftover local state - not an app bug, not a red build, and not part of
      # the smoke verdict, which is the exit code alone. So the log is tee-d whole and
      # nothing here greps, filters, or fails on stderr text.
      #
      # timeout-minutes: 15, and it is that number because smoke now pays for its own
      # compile (5e905c5): the worst measured cold cost of building this graph in this repo
      # is 2m11s with a private target dir, on CI the same graph is already warm from steps
      # 1-3c so this is normally seconds, and the harness adds only bounded waits (xtask
      # kills its pwsh child at 40 s, the row budget is 120 s). 15 min is ~7x that worst
      # measured compile and a third of the 45-minute job timeout - a hung GUI or a stuck
      # link now dies with THIS step named, instead of eating the whole job in silence.
      - name: smoke (product by default) — cargo run --locked -p xtask -- smoke (advisory - needs a desktop session)
        id: xtask_smoke
        continue-on-error: true
        shell: bash
        timeout-minutes: 15
        run: |
          set -o pipefail
          status=0
          cargo run --locked -p xtask --quiet -- smoke 2>&1 | tee "$RUNNER_TEMP/xtask-smoke.log" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          case "$status" in
            0) echo "smoke: PASS - a window appeared, WM_CLOSE shut the app down by itself, that run wrote session.json, and the user state the harness relocated is accounted for - byte-identical by the harness's own contract, which is what makes exit 1 below possible. Citable as written: graceful shutdown, real persistence, no profile left damaged. The outcome_note on the line above says WHICH pass it was - kept-app-artefact (this run wrote it, the user bytes parked aside) or restored-user-state (the user file came back unchanged) - so quote that token, not just the green." ;;
            1) echo "::error::SMOKE EXIT 1 - three unrelated readings share this code; separate them before citing it. Look at the smoke: window=.../close=.../session=... line and the SMOKE FAIL line above it. close=FORCED means the app had to be killed to stop it (shutdown bug). session=FAILED, with every path searched printed, means nothing was persisted (product bug). window=MISSING close=NOBIN means the exe disappeared between its build and the launch (an artifact that vanished, not a shutdown bug) - a TARGET THAT DOES NOT COMPILE IS EXIT 4, not this one. But if the log says the relocated user state did not come back byte-identical, or could not restore it and names a temp path, then THE HARNESS DAMAGED A USER PROFILE - an infrastructure emergency: put that file back by hand and fix the harness before this row is read as the app failing to persist." ;;
            2) echo "::error::SMOKE HARNESS COULD NOT RUN (exit 2) - the instrument failed before it could judge anything: no PowerShell to post WM_CLOSE with, the probe script could not be written or run, the source mtimes could not be read (deliberately NOT reported as 5/stale - that would accuse a binary of being old when nobody checked), or a bad invocation of cargo xtask smoke. Nothing was launched, so no verdict about the app exists in either direction; this is the one code that is always the harness own fault. Read the eprintln lines above for which precondition failed." ;;
            3) echo "::notice::smoke DECLINED - the summary line above says which of the two it was: (no desktop) means no interactive session to open a window in; (BLOCKED BY FOREIGN STATE) means something that is not a session file occupies the state path, which is machine pollution and not the app - the DECLINED line prints what is sitting there, with ACLs, and says clear the occupant. Neither is a failure; the check was simply not possible on this machine." ;;
            4) echo "::error::SMOKE EXIT 4 - THE TARGET DID NOT COMPILE. THE APP WAS NEVER LAUNCHED and no cached exe was substituted to keep the row green, so this says nothing about shutdown, persistence or geometry: it is a build failure, reported as an annotation only because a GUI step must not gate a headless runner. The line above (smoke: build | error[E...]) is the first real cargo error, and the step BEFORE this one (3b/3c) usually carries the same verdict with a name - fix the code, then re-read 1 and 3; do not treat a green 3b as proof this 4 is wrong, smoke builds the test profile itself." ;;
            5) echo "::error::SMOKE EXIT 5 - STALE BINARY: the notes-gpui.exe on disk is older than the sources that build it, so smoke refused to judge the running app against a build nobody compiled from this commit (window=STALE close=STALE session=STALE, and the identity line prints the age plus built_by_this_run=NO). Read it as the instrumentation refusing to lie about WHICH binary it tested: the app was never launched at all, so this is neither a product bug nor a pass - a verdict on a stale exe would be a claim about code that no longer exists. The --no-build diagnostic path asked for this; rebuild, do not force a run." ;;
            6) echo "::error::SMOKE EXIT 6 - THE WINDOW-MEMORY PROMISE DID NOT HOLD (GEOMETRY_FAILED_EXIT). This one IS the product: the app launched, restored a seeded rect, was moved, closed cleanly and wrote session.json - and one of those three measurements is wrong, so read the smoke: geometry: lines in the log above for which leg failed (RESTORE / PERSIST / ROUND-TRIP) with the deltas printed. What exit 6 means is the lane's own sentence: the window did not come back where the state file said, measured in frame pixels against the rect the app itself persisted. The 6 px margin (smoke.rs PLACEMENT_TOLERANCE) is judged against the chrome MEASURED from this very window on this run - every run prints 'smoke: geometry: measured chrome (frame -> client) = +8/+31/-8/-8 px' - and never against a modelled border, because the margin is deliberately below the smallest measured chrome and if some future build shrinks the border under 6 px the rule silently weakens; that is why the number is printed every run rather than asserted once in prose, and it states the limits of its own check. A space confusion is named ChromeOffset with its deltas and stays a WARNING, not memory loss; a rect that misses 6 px in NO named space is a genuine broken promise; geometry that could not be measured prints NOT JUDGED (advisory) and leaves the code alone. Still advisory (no desktop, no real work area, so a runner cannot gate on it) - but a red arm here is the most valuable line this job can print." ;;
            7) echo "::error::SMOKE EXIT 7 - THE PIN LIED (PIN_FAILED_EXIT). The app ran, closed cleanly and wrote the file, but WS_EX_TOPMOST on the live window did not follow session.json: both polarities were read on two launches, seed pinned:true must answer 1 and flipped to false it must answer 0, so a red here is one of the two headline product promises broken, not a measurement quibble. Do NOT jump to persistence: the usual cause is the ORDER of show-then-reband (an async topmost reband only survives on a visible window - the platform lane proved that), and the harness deliberately refuses to accuse the app because a show/pin race is possible. Read the two PIN lines above (smoke: geometry: PIN pinned:true -> WS_EX_TOPMOST=... and pinned:false -> ...) plus the app own stderr before deciding which lane owns it. Seen red on a real run already (pinned:true -> 0), so this arm is not theoretical." ;;
            9) echo "::error::SMOKE EXIT 9 - THE STARTUP ANNOUNCE NEVER REACHED THE LIVE UI (TRACE_FAILED_EXIT). Everything 1/4/5 accuse is absent here: the app built, launched, painted a window, took a real WM_CLOSE, exited 0 by itself and wrote session.json - and the stderr this step redirected from the live process named no RecentsUpdated while the state dir the APP RESOLVED held recents that were there to announce. That is roadmap M2 exit item 5 (Recents) asserted for the first time where no headless test can reach: the port knew the list and the running app was never shown it. Read the 'smoke: recents at startup: N read from <path>' line and the 'smoke: trace:' lines in the log above BEFORE blaming the app, because both ways this is NOT a product bug are printed rather than assumed: N=0 makes the claim NOT JUDGED (the engine announces only a NON-EMPTY list, and the count comes from the ONE directory the app itself opens - target/debug/data when the portable marker is there, the roaming profile only otherwise - so an install with no settings.toml in its own state dir cannot produce the line and never reddens this arm; the path is printed so a reader can see WHICH dir was counted), and a 0-byte capture is the redirect failing to see the app, also NOT JUDGED. A real 9 says a non-empty list went unannounced to a live window - a rendering gap, not a persistence gap, so it belongs to the bridge lane and not to core or api. The evidence line names which voice carried it: [rendered] is a status line the UI showed, [arrived] is the bridge per-event arrival line - the strongest voice always available, since a startup batch can hide the announce from the rendered line without losing it - and [delivered, never rendered] is the exit drain naming an event that never got a frame. The STRONGEST voice present is cited, not the first line written. Advisory like every code here: the step stays continue-on-error because a GUI row going red on a machine with no desktop is noise, and an armed arm is what keeps a REAL red readable without gating on it." ;;
            *) echo "::error::SMOKE COULD NOT JUDGE (exit $status) - the harness itself failed before any verdict: no PowerShell to post WM_CLOSE with, the probe script could not be written or run, unreadable mtimes on the sources (a broken instrument, deliberately not reported as 5/stale), or a bad invocation of cargo xtask smoke. This arm deliberately names NO numbers - an arm that enumerates codes is a list that goes out of date, and it has already gone stale twice in this file - so anything reaching here is an unknown contract change: read it as no information about the app, never as a pass and never as a missing desktop." ;;
          esac
          exit $status

      # --- 3f/3g. THE SECOND BRIDGE, linked and linted -------------------------
      # M5-S0, and the finding behind it is worth keeping in the file: the gate job built
      # ONE exe, notes-gpui.exe, and this repo now ships a second binary. Nothing about
      # that gap was visible in the roster - slint is not the excluded member, so it rode
      # steps 2 and 3 green from the day it landed - but clippy never LINKS and
      # `cargo test` links a test harness, never a `[[bin]]`. So the crates that hold
      # `[lints]` exceptions the other crates cannot (this bridge denies unsafe_code and
      # repeats the workspace lints locally, precisely so a toolkit macro problem stays
      # attributable), a build.rs-free crate whose exe is produced by nothing in CI, and a
      # bin rename in Cargo.toml were all invisible here.
      # Commands byte-for-byte as check.rs's slint-build / slint-clippy rows resolve them
      # (signature() drops --config and its value, so adding one later cannot break the
      # match - but see the flag note in check.rs: NO future-incompat suppression here,
      # because none was measured for slint's graph).
      # GATE both, not advisory, matching the rows: a link break in the shipped front
      # door must not be able to reach master as an annotation. UNBOUNDED on purpose like
      # 3b/3c, with the same reasoning (a cold slint compile is minutes; the 45-minute job
      # timeout is the backstop, and a guessed step timeout below the cold graph build
      # turns a slow green into a false red).
      # POSITION: after 3e deliberately, not beside 3b. 3d mutates the exe 3b linked and
      # 3h launches that same file; the slint pair builds a DIFFERENT binary, so placing
      # it between that write and its read-back would only make the chain harder to read.
      # (3h, not 3e: since DEFAULT_BINARY landed, 3e launches notes-slint.exe, which this
      # step also builds - so the order keeps the two artifacts' chains apart either way.)
      # What it does NOT do, stated so nobody assumes it: there is no manifest step for
      # notes-slint.exe. crates/bridge-slint has no build.rs and no app.manifest today, so
      # `xtask manifest` has nothing of ours to verify in that artifact; giving the second
      # bridge the same identity/DPI declaration is an M5 slice with a decision in it, not
      # a freebie to extend here.
      - name: slint — cargo build --locked -p notes-bridge-slint --bin notes-slint (the exe must link)
        id: slint_build
        shell: bash
        run: |
          set -o pipefail
          status=0
          cargo build --locked -p notes-bridge-slint --bin notes-slint 2>&1 | tee "$RUNNER_TEMP/slint-build.log" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          while IFS= read -r line; do
            echo "::error::$line"
          done < <(grep -E '^error' "$RUNNER_TEMP/slint-build.log" | head -12 || true)
          if [ "$status" = "0" ]; then
            echo "slint build: notes-slint.exe linked."
          else
            echo "::error::SLINT BUILD FAILED (exit $status) - notes-slint.exe did not link, or a dependency did not compile. This is the gate that says the SECOND shipped binary is buildable; the crate names in the annotations above say which."
          fi
          exit $status

      # Separate step, separate name, for the reason 3c already states: "the lint broke"
      # and "the link broke" must be two different red cells. --all-targets, so the
      # in-crate #[cfg(test)] module and the support/ mock this bridge's tests share are
      # linted too - the same surface that quietly accumulates dead_code under
      # -D warnings everywhere else.
      - name: clippy (slint) — cargo clippy --locked -p notes-bridge-slint --all-targets -- -D warnings
        id: slint_clippy
        shell: bash
        run: |
          set -o pipefail
          status=0
          cargo clippy --locked -p notes-bridge-slint --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/slint-clippy.log" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          while IFS= read -r line; do
            echo "::error::$line"
          done < <(grep -E '^(error|warning)(\[[0-9A-Za-z-]+\])?:' "$RUNNER_TEMP/slint-clippy.log" | head -12 || true)
          if [ "$status" = "0" ]; then
            echo "clippy (slint): clean at -D warnings."
          else
            echo "::error::CLIPPY FAILED ON THE SLINT BRIDGE (exit $status) - a lint, or a real compile error, under -D warnings."
          fi
          exit $status

      # --- 3h. THE FROZEN SCHEDULE, PINNED EXPLICITLY (ADR-0006) ------------------
      # The same instrument as 3e, pointed BACK at the gpui needle schedule by an explicit
      # `--binary=gpui` (crates/xtask/src/smoke.rs: BINARY_NAMES, select_target). Why this
      # row moved: it used to run `smoke --binary=slint`, and the moment DEFAULT_BINARY
      # made a bare `smoke` the product leg, that became a second cell asking for exactly
      # the verdict 3e already asks for - a duplicate, and a misleading name for it.
      # Deleting the row is what the freeze law forbids: ADR-0006 froze bridge-gpui with its
      # rows intact, rows may not LOOSEN, and the needle schedule's automated coverage must
      # not die quietly. So the row is REPURPOSED rather than removed - same shape, same
      # budget, same advisory colour, now naming the one leg the default no longer covers.
      # gpui is no longer what you get for typing nothing; it is what you get for asking.
      #
      # Shape copied from 3e deliberately: advisory, bash, tee-d whole, the status echoed
      # to GITHUB_OUTPUT, and every verdict armed. ADVISORY for the same reason and no
      # other - a headless runner has no window station, and an environmental red on a GUI
      # row trains people to ignore the row. That is a judgement about DESKTOPS, not about
      # the code: 3b/3c GATE this binary's link and lints, so what this step can add is the
      # running-app verdict, never a compile verdict.
      #
      # The arms below cover 0/1/2/3 from this leg plus 4/5 from the build and staleness
      # guards that run before it. 6/7/9 - the needle schedule's own product verdicts, the
      # ones THIS step can produce and 3e now cannot - carry no arm here on purpose: check-ci
      # judges the ROSTER of commands and the arms of the smoke row it recognises, which is
      # the one whose command ends at the subcommand (3e), so this step's wording is a human
      # claim either way, and a 6/7/9 reaching the catch-all below says so and points at 3e
      # for their sentences. Arming them here would copy prose, not add coverage.
      #
      # timeout-minutes: 15, same number as 3e for the same measured reason: smoke pays for
      # its own compile (worst measured cold cost of this graph, 2m11s with a private target
      # dir), the row budget is 120 s, and a hung GUI should die with THIS step named
      # instead of eating the 45-minute job.
      - name: smoke (frozen gpui schedule - ADR-0006) — cargo run --locked -p xtask -- smoke --binary=gpui (advisory - needs a desktop session)
        id: xtask_smoke_gpui
        continue-on-error: true
        shell: bash
        timeout-minutes: 15
        run: |
          set -o pipefail
          status=0
          cargo run --locked -p xtask --quiet -- smoke --binary=gpui 2>&1 | tee "$RUNNER_TEMP/xtask-smoke-gpui.log" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          case "$status" in
            0) echo "smoke (frozen gpui schedule): PASS - notes-gpui.exe opened a real window and ran the FULL needle schedule: self-hide, the window/close/session triple, the geometry and recents probes - then answered a WM_CLOSE by exiting 0 BY ITSELF and wrote session.json. This is the leg 3e no longer produces, and the reason this row exists: the frozen bridge's own contract, still automated, now pinned by --binary=gpui instead of by a default." ;;
            1) echo "::error::SMOKE EXIT 1 (frozen gpui schedule) - the instrument ran and a leg of the needle schedule failed. Read the smoke: window=.../close=.../session=... line and the SMOKE FAIL line above it: close=FORCED means the app had to be killed to stop it (shutdown bug); session=FAILED, with every path searched printed, means nothing was persisted (product bug); window=MISSING close=NOBIN means the exe vanished between its build and the launch, which is not a shutdown bug either. A target that does not compile is exit 4, not this one. Do NOT read this row as the product failing - this leg launched notes-gpui.exe, named on the identity line above; 3e is the row that judges notes-slint.exe." ;;
            2) echo "::error::SMOKE HARNESS COULD NOT RUN (exit 2, frozen gpui schedule) - the instrument failed before it could judge anything: no PowerShell to post WM_CLOSE with, the probe script could not be written or run, the source mtimes could not be read (deliberately NOT reported as 5/stale), or a bad invocation of cargo xtask smoke --binary=gpui. Nothing was launched, so no verdict about the app exists in either direction; this is the one code that is always the harness own fault. Read the eprintln lines above for which precondition failed." ;;
            3) echo "::notice::smoke (frozen gpui schedule) DECLINED - the summary line above says which of the two it was: (no desktop) means no interactive session to open a window in; (BLOCKED BY FOREIGN STATE) means something that is not a session file occupies the state path, which is machine pollution and not the app - the DECLINED line prints what is sitting there. Neither is a failure and neither is a pass; the check was simply not possible on this machine." ;;
            4) echo "::error::SMOKE EXIT 4 (frozen gpui schedule) - THE TARGET DID NOT COMPILE. notes-gpui.exe was never launched and no cached exe was substituted to keep the row green, so this says nothing about shutdown, persistence or geometry: it is a build failure, reported as an annotation only because a GUI step must not gate a headless runner. 3b/3c usually carry the same verdict with a name - fix the code, and remember smoke builds its own target, so a green 3b does not refute this 4." ;;
            5) echo "::error::SMOKE EXIT 5 (frozen gpui schedule) - STALE BINARY: notes-gpui.exe on disk is older than the sources that build it, so the harness refused to judge the running app against a build nobody compiled from this commit (window=STALE close=STALE session=STALE, and the identity line prints the age plus built_by_this_run=NO). Read it as the instrumentation refusing to lie about WHICH binary it tested: the app was never launched, so this is neither a product bug nor a pass. Rebuild, do not force a run." ;;
            *) echo "::error::SMOKE (frozen gpui schedule) COULD NOT JUDGE (exit $status) - an unrecognised verdict. This arm deliberately names NO numbers: check-ci's contract rule does NOT judge this step (it arms the smoke row whose command ends at the subcommand, i.e. 3e), so 6/7/9 - the needle verdicts THIS leg can genuinely produce - have no sentence below and land here, where the log above and 3e's comment carry their wording. Read anything reaching this arm as no information about the app, never as a pass and never as a missing desktop." ;;
          esac
          exit $status

      # --- 4. architecture invariants (== the `cargo arch` alias) ------------
      # Replaces the six "cargo tree -p X -i Y | must be empty" probes in AGENTS.md,
      # evaluated from cargo metadata (crates/xtask/src/arch.rs). Exit codes:
      #   0 clean | 1 a layering rule was violated | 2 the check itself could not run.
      # Each violation prints "ARCH VIOLATION: <pkg> ... [rule: <rule-id>]" and is
      # re-emitted below as an annotation, so a failure names the rule id.
      - name: arch — cargo run --locked -p xtask -- check-arch
        id: arch
        shell: bash
        run: |
          # Actions runs shell: bash on Windows as "bash -e" WITHOUT pipefail, so a
          # failing cargo behind "| tee" would otherwise read as tee success.
          set -o pipefail
          status=0
          cargo run --locked -p xtask -- check-arch 2>&1 | tee "$RUNNER_TEMP/check-arch.log" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # One annotation per violated rule id, taken straight from check-arch's output.
          while IFS= read -r line; do
            echo "::error::$line"
          done < <(grep -o 'ARCH VIOLATION: .*' "$RUNNER_TEMP/check-arch.log" || true)
          case $status in
            0) echo "check-arch: clean — the layering rules in AGENTS.md hold." ;;
            1) echo "::error::LAYERING RULE VIOLATED (check-arch exit 1). The rule ids are in the ARCH VIOLATION lines above; the rule table lives in crates/xtask/src/arch.rs." ;;
            *) echo "::error::CHECK HARNESS FAILURE (check-arch exit $status) — the check itself could not run (workspace root / cargo metadata). This is not an architecture violation." ;;
          esac
          exit $status

      # --- 4a. dependency-declaration drift ----------------------------------
      # "cargo run -p xtask -- check-deps" (crates/xtask/src/deps.rs) reads the manifests
      # out of cargo metadata and rejects a member crate whose dependency declaration
      # drifts from the workspace template, or whose version diverges from the pin. It
      # guards the exact class of break this file exists to catch: the ROOT template's
      # gpui line is what keeps default-features = false (and so gpui's windows-manifest
      # feature) off, and a member that re-pins gpui by itself re-enables the second
      # RT_MANIFEST id=1 - which then only surfaces as a linker error in 3b.
      # Its OWN step even though 4c runs the same command: the named cell is where you
      # look first, and the rule ids in the annotations below ([template-drift] /
      # [version-conflict]) say which invariant broke without opening a long log.
      # Exit codes: 0 clean | 1 at least one DEPS VIOLATION | 2 the checker could not run
      # (cargo metadata failed to resolve - a missing pin, a broken manifest). 2 is
      # neither a pass nor drift: it means drift was NOT judged. It still reddens this
      # step, and it reddens it because of the set -o pipefail line below - a gate that
      # goes green because its checker could not start is a gate nobody can trust. Read a
      # red with exit 2 as "fix the manifests, then find out whether the drift was real".
      - name: deps — cargo run --locked -p xtask -- check-deps (member manifests match the workspace template)
        id: deps
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          status=0
          cargo run --locked -p xtask -- check-deps 2>&1 | tee "$RUNNER_TEMP/check-deps.log" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # One annotation per violation, straight from the checker's own line format.
          while IFS= read -r line; do
            echo "::error::$line"
          done < <(grep -o 'DEPS VIOLATION: .*' "$RUNNER_TEMP/check-deps.log" || true)
          case $status in
            0) echo "check-deps: clean - every member manifest matches the workspace template and the pins." ;;
            1) echo "::error::DEPENDENCY DECLARATION DRIFT (check-deps exit 1). The DEPS VIOLATION lines above name the file and the rule id. Put the member back to the inherited form (workspace = true); do not widen the checker to make a row pass." ;;
            *) echo "::error::CHECK-DEPS COULD NOT RUN (exit $status) - cargo metadata did not resolve, so dependency drift was NOT judged; this is not a clean result. metadata's stderr is in the log above. Fix the manifest or the lock, then re-run: cargo xtask check-deps." ;;
          esac
          exit $status
      # --- 4b. byte-fidelity fixtures (the do-no-harm rule, whitepaper SS4.5) --
      # These 28 files ARE the proof that a load+save cycle leaves a foreign file
      # byte-identical: BOM present or absent, codepage, CRLF vs LF, trailing newline
      # or none. They are GENERATED, never hand-edited, because an editor silently
      # "tidies" a file that lacks a trailing newline - the exact corruption these
      # fixtures exist to detect - and .gitattributes marks the directory binary so Git
      # can never normalise the bytes either. This step is the net under both: it is what
      # catches someone opening a fixture in an IDE and committing the result. CI only
      # judges the fixtures; there is deliberately no "fixtures generate" step here.
      # Exit codes: 0 clean | 1 a fixture no longer matches its manifest sha256 | 2 the
      # verifier could not run (manifest missing/unreadable), which is not a violation.
      - name: fixtures — cargo run --locked -p xtask -- fixtures verify (encoding fixtures are byte-exact vs manifest)
        id: fixtures
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          status=0
          cargo run --locked -p xtask -- fixtures verify 2>&1 | tee "$RUNNER_TEMP/fixtures-verify.log" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # Annotate each offending fixture by name, straight from the verifier output.
          while IFS= read -r line; do
            echo "::error::$line"
          done < <(grep -o 'FIXTURES VIOLATION: .*' "$RUNNER_TEMP/fixtures-verify.log" || true)
          case $status in
            0) echo "fixtures verify: clean - every fixture matches the sha256 recorded in manifest.json." ;;
            1) echo "::error::FIXTURE BYTES CHANGED (fixtures verify exit 1). Either a fixture was opened and re-saved (an editor added a trailing newline, or Git normalised CRLF), or core round-trip behaviour changed. Fix the code, or re-generate deliberately with: cargo xtask fixtures generate. Never edit manifest.json by hand." ;;
            *) echo "::error::FIXTURES VERIFIER COULD NOT RUN (exit $status) - manifest.json is missing or unreadable. This is a harness failure, not a fidelity violation." ;;
          esac
          exit $status

      # --- 4c. drift lock: run the developer command itself -------------------
      # "cargo xtask check" (the literal cargo run -p xtask -- check below) runs the row
      # table in crates/xtask/src/check.rs: fmt, clippy, test, check-arch, check-deps and
      # fixtures verify as GATE rows, plus the bridge compile check, the GUI smoke row and
      # the docs validator as ADVISORY rows that are reported and never gate. (Two of those
      # deserve a word: the bridge row is a "cargo check" - compile only, so the LINK is
      # gated by 3b and not by xtask - and smoke is the row 3e names separately because a
      # window bug is worth its own cell.) The
      # explicit named steps above stay for that reason: a named cell points at one gate in
      # the Actions UI, and xtask's table is the developer's list, not CI's shape. What this
      # step buys is the lock between the two - when the table grows a check, CI grows it
      # the same day, whether or not anyone remembers to add a step here. Full, not --quick:
      # --quick skips clippy and test, exactly the coverage a drift lock must not lose.
      # Cheap, because target/ is warm from the steps above - re-verification, not a second
      # cold build. Exit 1 = a gate row failed, 2 = a gate row could not run; both are red
      # here, and 2 stays red on purpose - a checker that could not start proves nothing
      # about the thing it was meant to judge, so it must not read as a pass.
      # Spell subcommands the way xtask defines them: check-deps. There is no "cargo xtask
      # deps" and no alias for it (a cargo alias cannot rename an argument), so do not write
      # that name into a step and then explain an exit 2.
      - name: drift — cargo run --locked -p xtask -- check (the AGENTS.md gate as one command)
        id: xtask_check
        shell: bash
        run: |
          set -o pipefail
          status=0
          cargo run --locked -p xtask -- check 2>&1 | tee "$RUNNER_TEMP/xtask-check.log" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # xtask prints "<== [name] OUTCOME" per step; annotate the failing ones only
          # (advisory rows are excluded: they are reported, they do not gate).
          while IFS= read -r line; do
            echo "::error::$line"
          done < <(grep -E '^<== \[' "$RUNNER_TEMP/xtask-check.log" | grep -Ev 'PASS|SKIPPED|advisory' | head -10 || true)
          if [ "$status" = "0" ]; then
            echo "xtask check: every gate row PASS."
          else
            echo "::error::cargo xtask check exited $status - see the verdict table above (1 = a gate row failed, 2 = a gate row could not run). Advisory rows (bridge check, docs validator) never cause this."
          fi
          exit $status

      # --- 4d. the roster lock: CI and check.rs may not disagree ---------------
      # "cargo run -p xtask -- check-ci" (crates/xtask/src/check_ci.rs) parses THIS job
      # with its own reader and compares it against the roster derived from step_specs():
      #   [step-missing]       a row the developer gate runs that CI does not
      #   [step-extra]         a command CI runs that no row knows - a gate nobody can
      #                        reproduce locally, which is the mirror image of the hole
      #                        the drift lock at 4c closes
      #   [advisory-mismatch]  one side gates what the other parks
      #   [no-pipefail]        a piped bash step that can read green while failing
      #   [no-shell-bash]      bash-only syntax (or an advisory) with no shell: bash, so
      #                        windows-latest hands it to pwsh and it never runs
      # It BLOCKS, on purpose and as a real gate: 4c proves the same commands run, only
      # this compares the two lists, so without it a step could be deleted from CI or
      # quietly demoted while every local gate stayed green. Exit 2 is its own case: the
      # reader REFUSED to parse ci.yml rather than guess, and a workflow nothing can read
      # is a workflow nothing gates - so 2 must be fixed, never waved through.
      # Violations are re-emitted as annotations, so the Actions UI names the rule id.
      - name: roster — cargo run --locked -p xtask -- check-ci (CI steps match the xtask gate roster)
        id: check_ci
        shell: bash
        timeout-minutes: 5
        run: |
          set -o pipefail
          status=0
          cargo run --locked -p xtask -- check-ci 2>&1 | tee "$RUNNER_TEMP/check-ci.log" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          while IFS= read -r line; do
            echo "::error::$line"
          done < <(grep -o 'CI VIOLATION: .*' "$RUNNER_TEMP/check-ci.log" || true)
          case $status in
            0) echo "check-ci: the gate job and the xtask roster agree." ;;
            1) echo "::error::CI AND THE LOCAL GATE DISAGREE (check-ci exit 1). Each annotation above carries its rule id: step-missing = add the step here or delete the row in check.rs; step-extra = add the row or drop the step; advisory-mismatch = one side gated what the other parked; no-pipefail / no-shell-bash = the step cannot be trusted to report its own colour. Fix the side that is WRONG - a step in this file is a decision with a comment behind it, not a default to be silenced." ;;
            *) echo "::error::CHECK-CI COULD NOT JUDGE (exit $status) - it could not read ci.yml, or its reader refused a construct it would have to guess at. That is not a pass: fix the workflow text." ;;
          esac
          exit $status
      # --- 4e. the unsafe ledger, now a rule instead of a claim ----------------
      # "cargo run --locked -p xtask -- check-unsafe" (crates/xtask/src/check_unsafe.rs) scans the
      # platform sources and enforces the rules AGENTS.md states as an invariant that
      # nothing used to prove. This list is CHECKED, not proofread: the test
      # the_unsafe_rule_list_in_ci_yml_is_the_real_one compares it against
      # check_unsafe::RULE_IDS and fails if a rule is added to the checker without
      # being named here, or vice versa. No count word is typed above it on purpose -
      # a hand-written number in front of a machine-checked list only relocates the
      # lie. The list: [unsafe-outside-platform], [unsafe-without-safety],
      # [local-allowance], [allowance-outside-platform], [ledger-imbalance],
      # [raw-ffi-imbalance], [lint-missing], [lint-escape]. It BLOCKS:
      # unsafe is the one place where a polite mistake is a memory-safety bug, and until
      # this row existed the only enforcement was the honesty of whoever wrote the block.
      # The roster makes it non-quick-skippable, so the drift lock at 4c runs it too - the
      # named cell here exists to say WHICH rule escaped, in its own red.
      #
      # THE PRINT IS THE AUTHORITY, not any number in a prose file. The ratio quoted in
      # planning for weeks (14 blocks : 16 SAFETY comments) was wrong in every direction it
      # could be wrong, and two lanes repeating it honestly proved nothing - which is why a
      # checker replaced the manager. Measured at 04da77c, and re-printed into this log on
      # every run including a pass:
      #   unsafe: 17 blocks, 26 SAFETY comments in notes-platform (45 source files scanned,
      #   4 unsafe declarations) + both module-root #![allow(unsafe_code)] sites printed by
      #   path and line rather than assumed absent (crates/platform/src/windows/mod.rs and
      #   crates/platform/tests/geometry_live.rs). If a document disagrees with that line,
      #   the document is stale. Quote the run, never this comment.
      #
      # Exit codes: 0 clean | 1 a rule was violated | 2 the checker REFUSED to judge
      # (metadata unreadable, no platform member, no readable sources). 2 is red on
      # purpose: a ledger nobody counted is not a balanced ledger.
      - name: unsafe — cargo run --locked -p xtask -- check-unsafe (the unsafe ledger balances and stays in platform)
        id: check_unsafe
        shell: bash
        timeout-minutes: 5
        run: |
          set -o pipefail
          status=0
          cargo run --locked -p xtask -- check-unsafe 2>&1 | tee "$RUNNER_TEMP/check-unsafe.log" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # One annotation per violation, each carrying its bracketed rule id.
          while IFS= read -r line; do
            echo "::error::$line"
          done < <(grep -o 'UNSAFE VIOLATION: .*' "$RUNNER_TEMP/check-unsafe.log" || true)
          # Re-print the authoritative tally even on a pass, so the number lives in the log
          # of the run that earned it instead of in somebody memory.
          grep -E '^unsafe: ' "$RUNNER_TEMP/check-unsafe.log" | head -4 || true
          case $status in
            0) echo "check-unsafe: clean - the ledger balances, and every unsafe is in platform with a SAFETY comment." ;;
            1) echo "::error::UNSAFE LEDGER RULE VIOLATED (check-unsafe exit 1). The bracketed id above names which of the six escaped: unsafe-outside-platform (an unsafe where it may not be), unsafe-without-safety (no SAFETY comment near the block), local-allowance (a per-item allow is a loophole by definition), ledger-imbalance (more blocks than SAFETY comments), lint-missing / lint-escape (the workspace unsafe_code deny was dropped or overridden somewhere). Fix the code and the ledger - never edit a count, an allow, or this step to make the row pass." ;;
            *) echo "::error::CHECK-UNSAFE COULD NOT JUDGE (exit $status) - it refused to read cargo metadata, found no notes-platform member, or had no readable sources. An uncounted ledger is NOT a balanced one; fix the instrument before believing any green here." ;;
          esac
          exit $status
      # --- 5. docs placement validator ---------------------------------------
      # Its OWN step, never chained with a cargo command, and it runs even when a step
      # above failed: a docs edit landing mid-run must not red-fail a code gate, and a
      # red code gate must not mask a misplaced markdown file. Two verdicts, two names.
      # Measured green at 23 markdown files in the working tree (the 24th a local run
      # scans is a manager-*-journal.md: gitignored, so a CI checkout never contains it).
      # CI sees only COMMITTED markdown, and the section anchors are global across the
      # plan set: if a docs/*.md that OWNS a section is uncommitted, every file citing it
      # reports a dangling reference. Before believing a red here, check
      # `git ls-files "*.md"` against the working-tree count.
      #
      # ADVISORY: continue-on-error, because a tracked-files-only checkout cannot pass it
      # by design. docs/** and .agents/** are another manager's uncommitted split right
      # now - the files that OWN section anchors are not in the commit a runner sees, so
      # every inbound reference dangles and the validator is red on a clean checkout
      # regardless of anything in this repo's Rust. Gating a Rust change on that is the
      # wrong lever: it blocks the lane that is green to reward the lane that is parked.
      # check.rs declares the docs row advisory for the same reason, and check-ci (4d)
      # now enforces that the two agree - so this flag is the roster, not a shortcut.
      # It is still annotated and still reported: the verdict is printed, just not owed.
      - name: docs — .agents/skills/doc-management/scripts/check-docs.ps1
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: pwsh
        run: |
          pwsh -NoProfile -File .agents/skills/doc-management/scripts/check-docs.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::check-docs.ps1 exited $LASTEXITCODE - a markdown file is misplaced, or a front-matter / section reference is broken. The findings above name each file. Docs verdict only: no cargo command ran in this step."
          }
          exit $LASTEXITCODE

  # ===========================================================================
  # ADVISORY — NOT A GATE, and now deliberately small.
  # The bridge's fmt, build and clippy were PROMOTED into the gate above (steps 1, 3b,
  # 3c): it stopped being a stub, it links notes-gpui.exe, and an allow-fail job on a
  # linkable artifact is how a link break reaches master. What is left here is the one
  # bridge check that must not gate — its test run:
  #   * there are no GUI tests yet (crates/bridge-gpui holds only src/main.rs), and
  #   * a headless runner may not be able to create a window at all,
  # so a red here means either "the app broke" or "this machine has no desktop
  # session", and only one of those is actionable. A gate that cannot tell them apart
  # is noise; an advisory is a signal. Nothing in this job can turn the run red.
  # It also has a side benefit worth keeping: it compiles the same gpui graph at
  # cargo's DEFAULT future-incompat frequency, so the proc-macro-error2 note that the
  # gate's two bridge steps suppress still prints once per run, where nobody has to
  # read it to make a verdict.
  # ===========================================================================
  bridge-gpui-advisory:
    name: bridge-gpui / advisory (tests only; never gates)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      # Its OWN step: "cargo test" also compiles, so merging it with the summary below
      # would hide which of the two - a build break or a test/window failure - happened.
      # --locked here (and in core-portable) because check-ci parses the GATE job only,
      # so this half of the lock authority can land today without desynchronising the
      # roster; the gate steps get the flag in the commit that carries the matching rows.
      # --no-fail-fast: with no test suite yet, the value here is the full list of
      # whatever does exist, not the first failure.
      - name: test — cargo test -p notes-bridge-gpui (advisory - may need a desktop session)
        id: gpui
        shell: bash
        timeout-minutes: 15
        run: |
          set -o pipefail
          status=0
          cargo test --locked -p notes-bridge-gpui --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/gpui-test.log" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit $status

      # Runs on either outcome (the step above is allowed to fail) and prints exactly
      # one line, so the advisory is legible without scrolling a 441-crate build log.
      - name: summary — one-line bridge test status
        if: always()
        shell: bash
        run: |
          log="$RUNNER_TEMP/gpui-test.log"
          status="${{ steps.gpui.outputs.status }}"
          status=${status:-not-run}
          if [ ! -f "$log" ]; then
            echo "gpui-bridge: NO RESULT (test step did not run; status=$status) — advisory only, the gate is unaffected."
            exit 0
          fi
          errs=$(grep -c '^error' "$log" || true)
          passed=$(grep -cE '^test [^ ]+ \.\.\. ok$' "$log" || true)
          if [ "$status" = "0" ]; then
            echo "gpui-bridge: GREEN — cargo test --locked -p notes-bridge-gpui exit 0, ${passed:-0} tests passed, ${errs:-0} error lines. Advisory job; the gate does not depend on it."
          else
            first=$(grep -m1 -E '^(error|panic)' "$log" || true)
            echo "::warning::gpui-bridge: RED — cargo test --locked -p notes-bridge-gpui exit ${status}, ${errs:-?} error lines; first: ${first:-none captured}. Ambiguous by design (broken code vs. no window on a headless runner), which is why it is advisory. The gate's bridge steps (fmt/build/clippy) carry the real verdict."
          fi

  # ===========================================================================
  # CROSS-PLATFORM HONESTY FOR THE PURE CORE — read this before "fixing" it.
  # notes-core carries zero cfg(windows), and rules core-is-pure / core-no-os forbid UI
  # toolkits and OS FFI anywhere in its closure, so on Linux it must still compile and
  # its tests must still pass. If this job goes red while the Windows gate is green,
  # that is a real defect in core (a platform assumption leaked in), not a difference
  # between operating systems.
  #
  # crates/platform and crates/bridge-gpui are NOT built here ON PURPOSE — windows 0.61
  # and gpui are Windows-side concerns for this milestone (mac/linux land in M6-M8,
  # whitepaper SS6 / SS9). Not forgotten: see the deliberate-omissions note at the top.
  # `cargo arch` and check-docs.ps1 are not repeated here either: arch is metadata-only
  # and already gated on Windows, and check-docs.ps1's skip-list regex assumes '\' path
  # separators, so the docs verdict belongs to the Windows job and that job only.
  # ===========================================================================
  core-portable:
    name: core-portable / ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: clippy — cargo clippy --locked -p notes-core -p xtask --all-targets -- -D warnings
        run: cargo clippy --locked -p notes-core -p xtask --all-targets -- -D warnings

      - name: test — cargo test --locked -p notes-core -p xtask
        run: cargo test --locked -p notes-core -p xtask

      # Same verifier, on Linux, on purpose - not decoration. Manifest keys are flat
      # filenames (a test asserts none contains a backslash), joined with Path::join, and
      # verification is fs::read + sha256 over raw bytes with no text-mode translation, so
      # this must pass here exactly when it passes on Windows. A red HERE under a green
      # Windows gate means either a path-separator assumption leaked into the verifier or
      # a Linux checkout normalised fixture bytes (the "binary" rule in .gitattributes
      # stopped holding). check-arch and check-docs.ps1 stay Windows-only; see above.
      - name: fixtures — cargo run --locked -p xtask -- fixtures verify (encoding fixtures are byte-exact vs manifest)
        if: ${{ !cancelled() }}
        run: cargo run --locked -p xtask -- fixtures verify
