# CI gate for notes-gpui.
#
# Purpose: make AGENTS.md's "each invariant is enforced by CI" a true statement. Every
# command below is the manager's hand-run gate, encoded as measured — nothing here is a
# redesign of it. Local aliases exist (.cargo/config.toml: `cargo gate`, `cargo arch`,
# `cargo xtask`) and the literal commands are spelled out instead, so a failing step log
# reads as the same string you would type by hand.
#
# Deliberate omissions — each absent thing is a decision, not a gap:
#   * release packaging, MSIX/MSI  -> MSIX is ruled out on technical grounds (whitepaper SS7);
#                                     win-portable / win-install builds are M5 work.
#   * code signing                 -> no certificate exists; nothing to sign before M5.
#   * artifact upload              -> this file's whole job is a verdict, not a build product.
#   * codecov / coverage           -> a coverage number would become a target, not a signal.
#   * nightly or MSRV matrix       -> one toolchain: rust-toolchain.toml (channel = stable).
#                                     No setup-toolchain pin here on purpose — a patch pin would
#                                     fight rust-toolchain.toml and force a rustup download.
#   * ubuntu build of platform/bridge -> see core-portable below; excluded on purpose.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Verification, not deployment: the gate needs a read-only checkout token.
permissions:
  contents: read

# ~441 crates in the dependency graph: never finish a build for a superseded commit.
# cancel-in-progress is per-ref, so a new push or a new push to the same PR supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ===========================================================================
  # THE GATE. Windows-first app and crates/platform is cfg(windows), so the job
  # that decides "is M1 still standing?" must run on windows-latest.
  # ===========================================================================
  gate:
    name: gate / windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # v2 derives its key from Cargo.lock + toolchain + OS/arch itself. No bespoke key invented.
      - uses: Swatinem/rust-cache@v2

      # --- 1. formatting (rustfmt defaults, AGENTS.md "Code conventions") ----
      # "--all" means every workspace member, notes-bridge-gpui included: the bridge is
      # ALREADY format-gated here, so it needs no duplicate fmt step further down.
      - name: fmt — cargo fmt --all -- --check
        run: cargo fmt --all -- --check

      # --- 2. lints -----------------------------------------------------------
      # notes-bridge-gpui is excluded from THIS invocation only because gpui is pinned to
      # =0.2.2: one upstream deprecation would fail the workspace run for every crate at
      # once, and the exclusion keeps the verdict attributable. It is NOT a loophole - the
      # bridge is linted by its own named step below (3c), same -D warnings, its own
      # red/green. See 3b/3c for which bridge checks gate and which do not.
      - name: clippy — cargo clippy --workspace --exclude notes-bridge-gpui --all-targets -- -D warnings
        run: cargo clippy --workspace --exclude notes-bridge-gpui --all-targets -- -D warnings

      # --- 3. tests (== the `cargo gate` alias) ------------------------------
      - name: test — cargo test --workspace --exclude notes-bridge-gpui
        run: cargo test --workspace --exclude notes-bridge-gpui

      # --- 3b/3c. THE BRIDGE: which checks gate, and which deliberately do not -
      # One place, so nobody re-decides this per-file. notes-bridge-gpui is no longer a
      # stub: it carries build.rs + app.manifest and produces notes-gpui.exe, the shipped
      # artifact. An allow-fail advisory on that is a route for a link break to reach
      # master, so the split is:
      #   FMT     GATES  - and always did: step 1 is "cargo fmt --all", which covers every
      #                    workspace member including this one. Deliberately no second fmt
      #                    step here; a duplicate would only invite them to disagree.
      #   BUILD   GATES  - step 3b below. "cargo check" never links, so the real failure we
      #                    already hit (gpui's "windows-manifest" default feature embedding
      #                    a second RT_MANIFEST id=1 beside ours -> rust-lld refuses) is
      #                    invisible to a check-only gate, as is a version-pin divergence
      #                    on gpui =0.2.2 or an API break that bites only at link time.
      #   CLIPPY  GATES  - step 3c below, its OWN named step, --all-targets -D warnings.
      #   TEST    DOES NOT GATE - it stays advisory, in bridge-gpui-advisory. There are no
      #                    GUI tests to run yet, and a headless runner may not be able to
      #                    create a window at all: a red there means either "the app broke"
      #                    or "this machine has no desktop session", and a gate that cannot
      #                    tell those apart is noise that gets ignored. Advisory keeps the
      #                    signal without the false alarm.
      #
      # Where this was measured, because a promotion nobody ran is a lie: a CLEAN worktree
      # of HEAD 14295b8 ("git worktree add --detach", its own target dir) - never the
      # shared working tree, which is somebody else's half-landed edit - on Windows, with
      # the commands exactly as they appear below:
      #   cargo build  -p notes-bridge-gpui --bin notes-gpui              -> exit 0, 2m11s, notes-gpui.exe linked
      #   cargo clippy -p notes-bridge-gpui --all-targets -- -D warnings   -> exit 0, 1m26s
      #   cargo fmt --all -- --check                                       -> exit 0 (step 1 already covers the bridge)
      #   cargo run -p xtask -- check-deps                                 -> exit 0, "5 member crates, 0 violations" (step 4a)
      # Re-measure committed state before believing any of it, and mind that HEAD is a
      # moving target: one commit earlier (b238f1e) notes-api did NOT compile in a pristine
      # worktree - E0308 in gateway.rs against the then-uncommitted Engine::new arity and
      # Settings::load change - so 3b and 3c were red there and promoting them then would
      # have gated master on a lie. api landed at 14295b8 and both went green. Which is the
      # standing instruction for the next reader:
      #   * 3b/3c red with the error in ANOTHER crate: that crate's owner fixes it. Do not
      #     re-demote these steps to continue-on-error to unblock a run; the link is fine.
      #   * 3b/3c red with the error in the bridge, or rust-lld plus a duplicate resource:
      #     the bridge is broken, and these two steps are the gate that exists to say so.
      #
      # future-incompat-report.frequency=never, on these two bridge steps and nowhere else:
      # gpui's graph pulls proc-macro-error2 v2.0.1, whose future-incompat footer cargo
      # reprints on every invocation that actually compiles something (it is in both
      # measured runs above), and nothing in this repo can clear it. The scope is narrow by
      # design - this is NOT a warning suppression:
      #   * it hides that FOOTER ONLY. -D warnings still turns every rustc/clippy
      #     diagnostic in the same invocation into an error, and no step here pipes output
      #     through a filter, a "|| true", or a grep that could eat a real message; the
      #     greps below only ADD annotations, they never change the exit status.
      #   * it is a per-command --config flag, not a [future-incompat-report] entry in
      #     .cargo/config.toml, so it cannot leak into a developer run or another step.
      #   * the condition cannot rot unseen: bridge-gpui-advisory compiles the same graph
      #     at cargo's DEFAULT frequency, so the footer still prints once per run in a job
      #     that gates nothing, and "cargo report future-incompatibilities --id 1" shows it
      #     on demand. If a SECOND package ever joins that footer, that is new information
      #     and this suppression should be revisited, not inherited silently.
      #
      # --- 3b. the bridge LINKS ------------------------------------------------
      - name: bridge — cargo build -p notes-bridge-gpui --bin notes-gpui (the exe must link)
        id: bridge
        shell: bash
        run: |
          # Actions runs "shell: bash" on Windows as "bash -e" WITHOUT pipefail: without
          # this line, a cargo failure behind "| tee" reads as tee's success and a red
          # check prints green. Every piped bash step below carries it for that reason.
          set -o pipefail
          status=0
          cargo --config 'future-incompat-report.frequency="never"' build -p notes-bridge-gpui --bin notes-gpui 2>&1 | tee "$RUNNER_TEMP/bridge-build.log" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # Annotate the first errors so the cause is visible without scrolling a long log.
          while IFS= read -r line; do
            echo "::error::$line"
          done < <(grep -E '^error' "$RUNNER_TEMP/bridge-build.log" | head -12 || true)
          if [ "$status" = "0" ]; then
            echo "bridge build: notes-gpui.exe linked."
          else
            echo "::error::BRIDGE BUILD FAILED (exit $status) - notes-gpui.exe did not link, or a dependency did not compile. If the log shows rust-lld and a duplicate resource, that is the RT_MANIFEST id=1 clash: set default-features = false for gpui in the ROOT Cargo.toml (the bridge inherits it on purpose - see crates/bridge-gpui/Cargo.toml), do not weaken this step."
          fi
          exit $status

      # --- 3c. the bridge is linted too ----------------------------------------
      # Separate step, separate name, so "clippy broke" and "the link broke" are two
      # different red cells - one merged step would hide which check broke.
      - name: clippy (bridge) — cargo clippy -p notes-bridge-gpui --all-targets -- -D warnings
        id: bridge_clippy
        shell: bash
        run: |
          set -o pipefail
          status=0
          cargo --config 'future-incompat-report.frequency="never"' clippy -p notes-bridge-gpui --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/bridge-clippy.log" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # rustc/clippy diagnostics start at column 0; the leading anchor keeps source
          # snippets quoted inside a diagnostic from being annotated as if they were one.
          while IFS= read -r line; do
            echo "::error::$line"
          done < <(grep -E '^(error|warning)(\[[0-9A-Za-z-]+\])?:' "$RUNNER_TEMP/bridge-clippy.log" | head -12 || true)
          if [ "$status" = "0" ]; then
            echo "clippy (bridge): clean at -D warnings."
          else
            echo "::error::CLIPPY FAILED ON THE BRIDGE (exit $status) - a lint, or a real compile error, under -D warnings. The crate names in the annotations above say which."
          fi
          exit $status

      # --- 4. architecture invariants (== the `cargo arch` alias) ------------
      # Replaces the six "cargo tree -p X -i Y | must be empty" probes in AGENTS.md,
      # evaluated from cargo metadata (crates/xtask/src/arch.rs). Exit codes:
      #   0 clean | 1 a layering rule was violated | 2 the check itself could not run.
      # Each violation prints "ARCH VIOLATION: <pkg> ... [rule: <rule-id>]" and is
      # re-emitted below as an annotation, so a failure names the rule id.
      - name: arch — cargo run -p xtask -- check-arch
        id: arch
        shell: bash
        run: |
          # Actions runs shell: bash on Windows as "bash -e" WITHOUT pipefail, so a
          # failing cargo behind "| tee" would otherwise read as tee success.
          set -o pipefail
          status=0
          cargo run -p xtask -- check-arch 2>&1 | tee "$RUNNER_TEMP/check-arch.log" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # One annotation per violated rule id, taken straight from check-arch's output.
          while IFS= read -r line; do
            echo "::error::$line"
          done < <(grep -o 'ARCH VIOLATION: .*' "$RUNNER_TEMP/check-arch.log" || true)
          case $status in
            0) echo "check-arch: clean — the layering rules in AGENTS.md hold." ;;
            1) echo "::error::LAYERING RULE VIOLATED (check-arch exit 1). The rule ids are in the ARCH VIOLATION lines above; the rule table lives in crates/xtask/src/arch.rs." ;;
            *) echo "::error::CHECK HARNESS FAILURE (check-arch exit $status) — the check itself could not run (workspace root / cargo metadata). This is not an architecture violation." ;;
          esac
          exit $status

      # --- 4a. dependency-declaration drift ----------------------------------
      # "cargo run -p xtask -- check-deps" (crates/xtask/src/deps.rs) reads the manifests
      # out of cargo metadata and rejects a member crate whose dependency declaration
      # drifts from the workspace template, or whose version diverges from the pin. It
      # guards the exact class of break this file exists to catch: the ROOT template's
      # gpui line is what keeps default-features = false (and so gpui's windows-manifest
      # feature) off, and a member that re-pins gpui by itself re-enables the second
      # RT_MANIFEST id=1 - which then only surfaces as a linker error in 3b.
      # Its OWN step even though 4c runs the same command: the named cell is where you
      # look first, and the rule ids in the annotations below ([template-drift] /
      # [version-conflict]) say which invariant broke without opening a long log.
      # Exit codes: 0 clean | 1 at least one DEPS VIOLATION | 2 the checker could not run
      # (cargo metadata failed to resolve - a missing pin, a broken manifest). 2 is
      # neither a pass nor drift: it means drift was NOT judged. It still reddens this
      # step, and it reddens it because of the set -o pipefail line below - a gate that
      # goes green because its checker could not start is a gate nobody can trust. Read a
      # red with exit 2 as "fix the manifests, then find out whether the drift was real".
      - name: deps — cargo run -p xtask -- check-deps (member manifests match the workspace template)
        id: deps
        if: ${ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          status=0
          cargo run -p xtask -- check-deps 2>&1 | tee "$RUNNER_TEMP/check-deps.log" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # One annotation per violation, straight from the checker's own line format.
          while IFS= read -r line; do
            echo "::error::$line"
          done < <(grep -o 'DEPS VIOLATION: .*' "$RUNNER_TEMP/check-deps.log" || true)
          case $status in
            0) echo "check-deps: clean - every member manifest matches the workspace template and the pins." ;;
            1) echo "::error::DEPENDENCY DECLARATION DRIFT (check-deps exit 1). The DEPS VIOLATION lines above name the file and the rule id. Put the member back to the inherited form (workspace = true); do not widen the checker to make a row pass." ;;
            *) echo "::error::CHECK-DEPS COULD NOT RUN (exit $status) - cargo metadata did not resolve, so dependency drift was NOT judged; this is not a clean result. metadata's stderr is in the log above. Fix the manifest or the lock, then re-run: cargo xtask check-deps." ;;
          esac
          exit $status
      # --- 4b. byte-fidelity fixtures (the do-no-harm rule, whitepaper SS4.5) --
      # These 28 files ARE the proof that a load+save cycle leaves a foreign file
      # byte-identical: BOM present or absent, codepage, CRLF vs LF, trailing newline
      # or none. They are GENERATED, never hand-edited, because an editor silently
      # "tidies" a file that lacks a trailing newline - the exact corruption these
      # fixtures exist to detect - and .gitattributes marks the directory binary so Git
      # can never normalise the bytes either. This step is the net under both: it is what
      # catches someone opening a fixture in an IDE and committing the result. CI only
      # judges the fixtures; there is deliberately no "fixtures generate" step here.
      # Exit codes: 0 clean | 1 a fixture no longer matches its manifest sha256 | 2 the
      # verifier could not run (manifest missing/unreadable), which is not a violation.
      - name: fixtures — cargo run -p xtask -- fixtures verify (encoding fixtures are byte-exact vs manifest)
        id: fixtures
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          status=0
          cargo run -p xtask -- fixtures verify 2>&1 | tee "$RUNNER_TEMP/fixtures-verify.log" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # Annotate each offending fixture by name, straight from the verifier output.
          while IFS= read -r line; do
            echo "::error::$line"
          done < <(grep -o 'FIXTURES VIOLATION: .*' "$RUNNER_TEMP/fixtures-verify.log" || true)
          case $status in
            0) echo "fixtures verify: clean - every fixture matches the sha256 recorded in manifest.json." ;;
            1) echo "::error::FIXTURE BYTES CHANGED (fixtures verify exit 1). Either a fixture was opened and re-saved (an editor added a trailing newline, or Git normalised CRLF), or core round-trip behaviour changed. Fix the code, or re-generate deliberately with: cargo xtask fixtures generate. Never edit manifest.json by hand." ;;
            *) echo "::error::FIXTURES VERIFIER COULD NOT RUN (exit $status) - manifest.json is missing or unreadable. This is a harness failure, not a fidelity violation." ;;
          esac
          exit $status

      # --- 4c. drift lock: run the developer command itself -------------------
      # "cargo xtask check" (the literal cargo run -p xtask -- check below) runs the row
      # table in crates/xtask/src/check.rs: fmt, clippy, test, check-arch, check-deps and
      # fixtures verify as GATE rows, plus the bridge compile check and the docs validator
      # as ADVISORY rows that are reported and never gate. (That bridge row is a "cargo
      # check", compile-only by design - the LINK is gated by 3b, not by xtask.) The
      # explicit named steps above stay for that reason: a named cell points at one gate in
      # the Actions UI, and xtask's table is the developer's list, not CI's shape. What this
      # step buys is the lock between the two - when the table grows a check, CI grows it
      # the same day, whether or not anyone remembers to add a step here. Full, not --quick:
      # --quick skips clippy and test, exactly the coverage a drift lock must not lose.
      # Cheap, because target/ is warm from the steps above - re-verification, not a second
      # cold build. Exit 1 = a gate row failed, 2 = a gate row could not run; both are red
      # here, and 2 stays red on purpose - a checker that could not start proves nothing
      # about the thing it was meant to judge, so it must not read as a pass.
      # Spell subcommands the way xtask defines them: check-deps. There is no "cargo xtask
      # deps" and no alias for it (a cargo alias cannot rename an argument), so do not write
      # that name into a step and then explain an exit 2.
      - name: drift — cargo run -p xtask -- check (the AGENTS.md gate as one command)
        id: xtask_check
        shell: bash
        run: |
          set -o pipefail
          status=0
          cargo run -p xtask -- check 2>&1 | tee "$RUNNER_TEMP/xtask-check.log" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # xtask prints "<== [name] OUTCOME" per step; annotate the failing ones only
          # (advisory rows are excluded: they are reported, they do not gate).
          while IFS= read -r line; do
            echo "::error::$line"
          done < <(grep -E '^<== \[' "$RUNNER_TEMP/xtask-check.log" | grep -Ev 'PASS|SKIPPED|advisory' | head -10 || true)
          if [ "$status" = "0" ]; then
            echo "xtask check: every gate row PASS."
          else
            echo "::error::cargo xtask check exited $status - see the verdict table above (1 = a gate row failed, 2 = a gate row could not run). Advisory rows (bridge check, docs validator) never cause this."
          fi
          exit $status

      # --- 5. docs placement validator ---------------------------------------
      # Its OWN step, never chained with a cargo command, and it runs even when a step
      # above failed: a docs edit landing mid-run must not red-fail a code gate, and a
      # red code gate must not mask a misplaced markdown file. Two verdicts, two names.
      # Measured green at 23 markdown files in the working tree (the 24th a local run
      # scans is a manager-*-journal.md: gitignored, so a CI checkout never contains it).
      # CI sees only COMMITTED markdown, and the section anchors are global across the
      # plan set: if a docs/*.md that OWNS a section is uncommitted, every file citing it
      # reports a dangling reference. Before believing a red here, check
      # `git ls-files "*.md"` against the working-tree count.
      - name: docs — .agents/skills/doc-management/scripts/check-docs.ps1
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          pwsh -NoProfile -File .agents/skills/doc-management/scripts/check-docs.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::check-docs.ps1 exited $LASTEXITCODE - a markdown file is misplaced, or a front-matter / section reference is broken. The findings above name each file. Docs verdict only: no cargo command ran in this step."
          }
          exit $LASTEXITCODE

  # ===========================================================================
  # ADVISORY — NOT A GATE, and now deliberately small.
  # The bridge's fmt, build and clippy were PROMOTED into the gate above (steps 1, 3b,
  # 3c): it stopped being a stub, it links notes-gpui.exe, and an allow-fail job on a
  # linkable artifact is how a link break reaches master. What is left here is the one
  # bridge check that must not gate — its test run:
  #   * there are no GUI tests yet (crates/bridge-gpui holds only src/main.rs), and
  #   * a headless runner may not be able to create a window at all,
  # so a red here means either "the app broke" or "this machine has no desktop
  # session", and only one of those is actionable. A gate that cannot tell them apart
  # is noise; an advisory is a signal. Nothing in this job can turn the run red.
  # It also has a side benefit worth keeping: it compiles the same gpui graph at
  # cargo's DEFAULT future-incompat frequency, so the proc-macro-error2 note that the
  # gate's two bridge steps suppress still prints once per run, where nobody has to
  # read it to make a verdict.
  # ===========================================================================
  bridge-gpui-advisory:
    name: bridge-gpui / advisory (tests only; never gates)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      # Its OWN step: "cargo test" also compiles, so merging it with the summary below
      # would hide which of the two - a build break or a test/window failure - happened.
      # --no-fail-fast: with no test suite yet, the value here is the full list of
      # whatever does exist, not the first failure.
      - name: test — cargo test -p notes-bridge-gpui (advisory - may need a desktop session)
        id: gpui
        shell: bash
        timeout-minutes: 15
        run: |
          set -o pipefail
          status=0
          cargo test -p notes-bridge-gpui --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/gpui-test.log" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit $status

      # Runs on either outcome (the step above is allowed to fail) and prints exactly
      # one line, so the advisory is legible without scrolling a 441-crate build log.
      - name: summary — one-line bridge test status
        if: always()
        shell: bash
        run: |
          log="$RUNNER_TEMP/gpui-test.log"
          status="${{ steps.gpui.outputs.status }}"
          status=${status:-not-run}
          if [ ! -f "$log" ]; then
            echo "gpui-bridge: NO RESULT (test step did not run; status=$status) — advisory only, the gate is unaffected."
            exit 0
          fi
          errs=$(grep -c '^error' "$log" || true)
          passed=$(grep -cE '^test [^ ]+ \.\.\. ok$' "$log" || true)
          if [ "$status" = "0" ]; then
            echo "gpui-bridge: GREEN — cargo test -p notes-bridge-gpui exit 0, ${passed:-0} tests passed, ${errs:-0} error lines. Advisory job; the gate does not depend on it."
          else
            first=$(grep -m1 -E '^(error|panic)' "$log" || true)
            echo "::warning::gpui-bridge: RED — cargo test -p notes-bridge-gpui exit ${status}, ${errs:-?} error lines; first: ${first:-none captured}. Ambiguous by design (broken code vs. no window on a headless runner), which is why it is advisory. The gate's bridge steps (fmt/build/clippy) carry the real verdict."
          fi

  # ===========================================================================
  # CROSS-PLATFORM HONESTY FOR THE PURE CORE — read this before "fixing" it.
  # notes-core carries zero cfg(windows), and rules core-is-pure / core-no-os forbid UI
  # toolkits and OS FFI anywhere in its closure, so on Linux it must still compile and
  # its tests must still pass. If this job goes red while the Windows gate is green,
  # that is a real defect in core (a platform assumption leaked in), not a difference
  # between operating systems.
  #
  # crates/platform and crates/bridge-gpui are NOT built here ON PURPOSE — windows 0.61
  # and gpui are Windows-side concerns for this milestone (mac/linux land in M6-M8,
  # whitepaper SS6 / SS9). Not forgotten: see the deliberate-omissions note at the top.
  # `cargo arch` and check-docs.ps1 are not repeated here either: arch is metadata-only
  # and already gated on Windows, and check-docs.ps1's skip-list regex assumes '\' path
  # separators, so the docs verdict belongs to the Windows job and that job only.
  # ===========================================================================
  core-portable:
    name: core-portable / ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: clippy — cargo clippy -p notes-core -p xtask --all-targets -- -D warnings
        run: cargo clippy -p notes-core -p xtask --all-targets -- -D warnings

      - name: test — cargo test -p notes-core -p xtask
        run: cargo test -p notes-core -p xtask

      # Same verifier, on Linux, on purpose - not decoration. Manifest keys are flat
      # filenames (a test asserts none contains a backslash), joined with Path::join, and
      # verification is fs::read + sha256 over raw bytes with no text-mode translation, so
      # this must pass here exactly when it passes on Windows. A red HERE under a green
      # Windows gate means either a path-separator assumption leaked into the verifier or
      # a Linux checkout normalised fixture bytes (the "binary" rule in .gitattributes
      # stopped holding). check-arch and check-docs.ps1 stay Windows-only; see above.
      - name: fixtures — cargo run -p xtask -- fixtures verify (encoding fixtures are byte-exact vs manifest)
        if: ${{ !cancelled() }}
        run: cargo run -p xtask -- fixtures verify
