[package]
name = "notes-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# notes-core: dto.rs re-exports the core types a Command, an Event or
# InitialState has to carry (geometry::Rect, paths::StateDir, session::Session),
# because a bridge may import api and nothing else in this repo — those types
# have to be nameable from here. gateway.rs also reads session.json through it:
# the one synchronous pre-window read the port is allowed (D-STATE).
# thiserror: event::SaveError, whose Display text is the UI copy.
# Deps are added only as used: unused_crate_dependencies + clippy -D warnings
# make an unused dep a hard gate error.
notes-core = { workspace = true }
# notes-platform: the two host seams (WindowBackend, HostFacts), constructed by the
# port itself (D46). arch.rs allows this edge - it groups api with core and platform
# deliberately - and it is what lets the bridge register a window without ever naming
# a platform type, which is the whole point of the seam.
notes-platform = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# tests/reentrancy.rs points a Gateway at a throwaway state directory holding a
# hand-written session.json and a decoy note file. notes-core already uses
# tempfile for exactly this, so no new crate enters the graph.
tempfile = { workspace = true }

[lints]
workspace = true
