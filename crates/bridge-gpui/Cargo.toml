[package]
name = "notes-bridge-gpui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# THE ONE FEATURE OF THIS PACKAGE, and it exists for a test file. `tests/ime_seam.rs`
# carries a `window_driven` module - the only way to read the RUNTIME value of the
# `EntityInputHandler` defaults the platform actually calls - and a window cannot exist
# without GPUI's test harness, which the kit hides behind a feature of ITS OWN. This
# pass-through is what makes that module compile; without it the `cfg` there is a
# condition that can never be true and the three tests inside it have never run.
#
# Deliberately NOT a default: `cargo test --workspace` builds the shipped graph, where
# a window genuinely cannot exist. Run the evidence on purpose -
#   cargo test -p notes-bridge-gpui --features test-support --test ime_seam
# - which is also what `--all-features` does. And declaring it here is what stops
# `unexpected_cfgs` in that file from being a lie: the cfg now names a feature THIS
# package has.
[features]
test-support = ["gpui-kit/test-support"]

# The shipped artifact is notes-gpui(.exe). The package name stays
# notes-bridge-gpui because it names the adapter, not the product.
[[bin]]
name = "notes-gpui"
path = "src/main.rs"

[dependencies]
notes-api = { workspace = true }
# Inherited, and it has to stay inherited. THE KIT GENERATION: one toolkit dependency for the app,
# per .agents/skills/gpui-kit. gpui-kit 0.6.1 flat-re-exports gpui-pre 0.3.4 as `gpui_kit::*`, so
# every name this crate imported still exists - the diff is the generation, not the API.
# windows-manifest is now forced ON by gpui-pre-platform's own declaration (features are additive,
# nothing here can turn it off), so the toolkit's RT_MANIFEST ships in this executable and ours does
# not: two of them is the duplicate-resource link error the workspace comment above describes. That is
# why build.rs no longer embeds - it says so, and app.manifest stays in the tree for the post-link
# step another lane is building as `cargo xtask manifest`.
gpui-kit = { workspace = true }
# Only to read the HWND out of the window gpui created: HasWindowHandle is
# implemented by gpui itself (src/window.rs), so this is the toolkit handle
# Granted as the S1 FCR (root Cargo.toml line 32). Grapheme cluster boundaries for the
# caret and for every replacement range: a UTF-16 unit index from the platform can land
# between a base character and its combining mark, and slicing there is legal UTF-8 that
# has separated something the user sees as one glyph. UnicodeSegmentation is used in
# editor.rs only, and gpui has it as a DEV dependency, which is why the example can use
# it without telling us.
unicode-segmentation = { workspace = true }
# accessor, not a route around the port. No windows-rs type appears in this crate.
raw-window-handle = { workspace = true }
