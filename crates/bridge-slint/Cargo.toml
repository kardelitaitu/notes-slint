# SLINT SPIKE, slice 0: the skeleton only. There is NO Slint UI in here yet - see
# src/probe.rs (STRIP-0: it is src/main.rs until 2026-09-15, same bytes) for what this crate is
# for and what slice 1 starts from.
#
# It is a BRIDGE, so the layering instrument holds it to the same rule as bridge-gpui:
# it may import notes-api and its OWN toolkit, nothing else in this repo (arch.rs,
# "bridge-sees-only-api" - now one row per bridge, not one row for one bridge).
[package]
name = "notes-bridge-slint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# `[lints] workspace = true` is deliberately NOT used here, so the lints the workspace
# sets are REPEATED below with the one exception the toolkit's own generated code needs -
# and the exception is named where it cannot be mistaken for a pattern, or silently
# copied into a shipped bridge. See the unsafe_code note.
[lints.rust]
# "deny", not "forbid" - and not "allow", which is what a first pass here said.
# Measured on slint 1.17.1: the slint! expansion emits vtable statics whose own
# #[allow(unsafe_code)] wraps real unsafe, so `forbid` is an instant E0453:
# "allow(unsafe_code) incompatible with previous forbid". An inherited
# `[lints] workspace = true` cannot relax the workspace forbid - the block has to be
# local. `deny` keeps AGENTS.md's gate on everything hand-written in this crate while
# the toolkit's generated code still compiles. A true `forbid` needs the slint!
# expansion behind its own crate boundary: a shipped-bridge shape decision, not a
# spike one.
unsafe_code = "deny"
unused_crate_dependencies = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }

# STRIP-0, dated 2026-09-15: TWO names, ONE source. This is the honest transitional lie, and it
# is a lie about the future, not about the present: the product IS the probe for exactly this
# commit. `notes-slint` is the name every downstream owner fences against - the icon and version
# resource, the application manifest, the portable folder, the %APPDATA% identity, the smoke leg
# (xtask/src/smoke.rs: bin "notes-slint" -> notes-slint.exe), and check.rs's slint-build row - so
# it is declared FIRST and keeps compiling the probe until STRIP-1..n land a real product source
# beside it. `notes-slint-probe` is the same bytes under the name the spike deserves, so the two
# identities are already separable in the build graph before anyone has to decide, mid-slice,
# which exe a check was ever talking about. Both targets share every dependency today; the day a
# dependency binds only one of them is a strip-slice problem (and `unused_crate_dependencies`
# above will say so loudly), not a reason to delay this table-setting.
[[bin]]
name = "notes-slint"
path = "src/probe.rs"

[[bin]]
name = "notes-slint-probe"
path = "src/probe.rs"

[dependencies]
notes-api = { workspace = true }
# Inherited whole, with NOTHING added here, and that is a cargo rule rather than a
# style preference: a member may not override `default-features` when the workspace
# table sets it - the manifest is refused outright. So compat-1-2 (mandatory),
# backend-winit, renderer-software and raw-window-handle-06 are declared once, at the
# root, with the reasons. A member that needs another feature may add one; it cannot
# subtract, and it must not restate what it inherits.
slint = { workspace = true }
# The trait objects `window_handle()` hands back; the same pin bridge-gpui uses.
raw-window-handle = { workspace = true }
# S9: the native picker, ON THE THREAD. Declared once at the root with the reason;
# here it is only used.
rfd = { workspace = true }
